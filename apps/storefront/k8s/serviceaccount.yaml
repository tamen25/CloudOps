apiVersion: v1
kind: ServiceAccount
metadata:
  name: "${STOREFRONT_SERVICE_ACCOUNT}"
  namespace: "${STOREFRONT_NAMESPACE}"
  annotations:
    #IRSA — assumes the storefront IAM role for cart Dynamo, ws-token
    #signing, and Step Functions StartExecution. ARN comes from Terraform
    #output `storefront_irsa_role_arn` (modules/storefront-cart in #84,
    #modules/storefront-checkout in #87).
    eks.amazonaws.com/role-arn: "${STOREFRONT_IRSA_ROLE_ARN}"
