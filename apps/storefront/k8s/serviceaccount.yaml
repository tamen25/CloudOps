apiVersion: v1
kind: ServiceAccount
metadata:
  name: "${STOREFRONT_SERVICE_ACCOUNT}"
  namespace: "${STOREFRONT_NAMESPACE}"
  annotations:
    #IRSA — assumes the storefront IAM role for cart Dynamo, ws-token
    #signing, Step Functions StartExecution, and privacy-erasure realtime
    #connection cleanup. ARN comes from Terraform output
    #`storefront_irsa_role_arn` (modules/storefront-cart in #84,
    #modules/storefront-checkout in #87, modules/storefront-realtime).
    eks.amazonaws.com/role-arn: "${STOREFRONT_IRSA_ROLE_ARN}"
