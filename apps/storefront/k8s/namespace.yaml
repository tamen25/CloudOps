#Storefront namespace. PSS restricted enforced by in-tree admission
#(no Gatekeeper required). Pod specs satisfy restricted: runAsNonRoot,
#UID/GID 1001, allowPrivilegeEscalation=false, capabilities drop ALL,
#readOnlyRootFilesystem, seccompProfile RuntimeDefault.
apiVersion: v1
kind: Namespace
metadata:
  name: "${STOREFRONT_NAMESPACE}"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
