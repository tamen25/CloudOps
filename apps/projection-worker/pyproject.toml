# Projection worker (Python). Kinesis consumer building a per-tenant read model.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloudops-projection-worker"
version = "1.0.0"
description = "CloudOps mesh projection worker — builds a read model from order events."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3==1.35.71",
  "opentelemetry-api==1.41.0",
  "opentelemetry-sdk==1.41.0",
  "opentelemetry-exporter-otlp-proto-http==1.41.0",
  "opentelemetry-instrumentation-botocore==0.62b0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/projection"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["projection"]
# poller.py is the boto3 Kinesis poll loop (live AWS I/O) — excluded like the
# tracing/server boundaries elsewhere in the mesh. The foldable logic it drives
# (decode_record, ReadModel.apply) lives in readmodel.py and is fully covered.
omit = ["src/projection/poller.py"]
