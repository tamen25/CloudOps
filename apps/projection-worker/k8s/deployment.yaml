# projection-worker (Python) — Kinesis consumer building a read model.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-worker
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: projection-worker
    mesh.cloudops/lang: python
spec:
  # Single consumer in dev to avoid shard contention; scale with shard count.
  replicas: ${PROJECTION_REPLICAS}
  selector:
    matchLabels:
      app: projection-worker
  template:
    metadata:
      labels:
        app: projection-worker
        mesh.cloudops/lang: python
    spec:
      serviceAccountName: "${PROJECTION_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: projection-worker
          image: "${PROJECTION_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          env:
            - name: PORT
              value: "8080"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: KINESIS_STREAM_NAME
              value: "${KINESIS_STREAM_NAME}"
            - name: POLL_INTERVAL_SECONDS
              value: "${PROJECTION_POLL_INTERVAL_SECONDS}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "projection-worker"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 4
            periodSeconds: 10
            failureThreshold: 3
