# fraud ClusterIP service. Reachable in-mesh as
# fraud.${MESH_NAMESPACE}.svc.cluster.local on port 80.
apiVersion: v1
kind: Service
metadata:
  name: fraud
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: fraud
spec:
  selector:
    app: fraud
  ports:
    - name: http
      port: 80
      targetPort: http
