# fraud (Spring Boot / Java) — risk-score an order. OTel via the Java agent
# baked into the image; agent reads the OTEL_* env below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: fraud
    mesh.cloudops/lang: java
spec:
  replicas: ${FRAUD_REPLICAS}
  selector:
    matchLabels:
      app: fraud
  template:
    metadata:
      labels:
        app: fraud
        mesh.cloudops/lang: java
    spec:
      serviceAccountName: "${FRAUD_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: fraud
          image: "${FRAUD_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "fraud"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            # The Java agent picks up the bearer token from this header var.
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "${OTEL_OTLP_HEADERS}"
            # Disable the agent's metrics/logs export by default; traces only
            # keeps the demo light. Override per env if needed.
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
