# Pricing service (Go) — one job: quote a set of line items.
# Placeholders rendered by scripts/render-k8s.ts. securityContext mirrors
# order-api (Gatekeeper K8sNoRootContainers + read-only root FS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: pricing
    mesh.cloudops/lang: go
spec:
  replicas: ${PRICING_REPLICAS}
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
        mesh.cloudops/lang: go
    spec:
      serviceAccountName: "${PRICING_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pricing
          image: "${PRICING_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "pricing"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
