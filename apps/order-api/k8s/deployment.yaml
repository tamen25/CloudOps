apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: "${ORDER_API_NAMESPACE}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      serviceAccountName: "${ORDER_API_SERVICE_ACCOUNT}"
      containers:
        - name: order-api
          image: "${ORDER_API_IMAGE}"
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "256m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "${ORDER_API_ENVIRONMENT}"
            - name: PORT
              value: "3000"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: DB_NAME
              value: "${DB_NAME}"
            - name: DB_SECRET_ARN
              value: "${DB_SECRET_ARN}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
            - name: OTEL_SERVICE_NAME
              value: "order-api"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: METRICS_PORT
              value: "9090"
            # Optional: set to a Secrets Manager ARN to enforce X-Api-Key on
            # /order and /orders. Leave empty to run unauthenticated.
            - name: API_KEY_SECRET_ARN
              value: "${API_KEY_SECRET_ARN}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
