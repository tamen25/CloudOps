apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: "${ORDER_API_NAMESPACE}"
spec:
  replicas: ${ORDER_API_REPLICAS}
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      serviceAccountName: "${ORDER_API_SERVICE_ACCOUNT}"
      #Closes backlog #36 — Gatekeeper K8sNoRootContainers requires
      #runAsNonRoot=true or runAsUser>0. UID 1001 matches the `nodejs` user
      #created in the Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: rds-ca
          emptyDir: {}
        #Backlog #56 — readOnlyRootFilesystem requires a writable tmp dir
        #for any libraries that write scratch files (pino transports,
        #tempfiles in the AWS SDK).
        - name: tmp
          emptyDir: {}
      #Backlog #57 — fetch the RDS global CA bundle once per pod start. The
      #bundle is published at a stable URL by AWS; no IAM required. The
      #main container reads `/etc/rds/global-bundle.pem` via DB_SSL_CA_BUNDLE.
      initContainers:
        - name: fetch-rds-ca
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - >-
              curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
              -o /etc/rds/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writes only to the /etc/rds emptyDir
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
      containers:
        - name: order-api
          image: "${ORDER_API_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            #Backlog #56 — read-only root filesystem; writable scratch via
            #the `tmp` emptyDir mount.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: "256m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "${ORDER_API_ENVIRONMENT}"
            - name: PORT
              value: "3000"
            - name: AWS_REGION
              value: "${AWS_REGION}"
            - name: DB_NAME
              value: "${DB_NAME}"
            - name: DB_SECRET_ARN
              value: "${DB_SECRET_ARN}"
            #Backlog #57 — TLS to RDS. Bundle is fetched by the
            #`fetch-rds-ca` initContainer; pg.Pool is configured with
            #rejectUnauthorized=true.
            - name: DB_SSL_CA_BUNDLE
              value: "/etc/rds/global-bundle.pem"
            - name: DB_SSL_DISABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
            - name: OTEL_SERVICE_NAME
              value: "order-api"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CONTAINER_NAME
              value: "order-api"
            - name: METRICS_PORT
              value: "9090"
            #Optional: set to a Secrets Manager ARN to enforce X-Api-Key on
            #/order and /orders. Leave empty to run unauthenticated.
            - name: API_KEY_SECRET_ARN
              value: "${API_KEY_SECRET_ARN}"
            #OIDC / JWKS bearer-token auth (closes backlog #7). Set all
            #three to enable JWT validation in addition to (or instead of)
            #the X-Api-Key path. Leave empty to disable.
            - name: OIDC_ISSUER
              value: "${OIDC_ISSUER}"
            - name: OIDC_AUDIENCE
              value: "${OIDC_AUDIENCE}"
            - name: OIDC_JWKS_URL
              value: "${OIDC_JWKS_URL}"
            - name: OIDC_REQUIRED_SCOPES
              value: "${OIDC_REQUIRED_SCOPES}"
            #INTERNAL_HMAC_SECRET (closes backlog #81) — shared secret between
            #order-api and the search-gateway Lambda + admin UI server. Empty
            #disables `/_internal/*` routes (returns 503). Wired from
            #Secrets Manager via External Secrets in non-dev envs.
            - name: INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: order-api-internal
                  key: hmac-secret
                  optional: true
            #INTERNAL_HMAC_SECRET_PREVIOUS (closes backlog #96) — optional
            #grace-window key accepted alongside the active secret during
            #rotation. ExternalSecret writes the prior value to
            #`hmac-secret-previous`; clear it after every caller has rolled.
            - name: INTERNAL_HMAC_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: order-api-internal
                  key: hmac-secret-previous
                  optional: true
            #ALLOWED_ORIGINS (closes backlog #97) — comma-separated allow-list
            #for browser-originated POST/PUT/PATCH/DELETE. Empty/unset =
            #permissive (dev only). Set to the storefront + admin origins in
            #staging/prod. RSC server-to-server fetches do not send Origin
            #and are always allowed.
            - name: ALLOWED_ORIGINS
              value: "${ALLOWED_ORIGINS}"
            #Kinesis order-event stream (closes backlog #85). Empty disables
            #publishing — app continues to commit orders normally.
            - name: KINESIS_STREAM_NAME
              value: "${KINESIS_STREAM_NAME}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
