apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-api
  namespace: cloudops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Populate with: terraform output -raw certificate_arn  (from module.ingress)
    alb.ingress.kubernetes.io/certificate-arn: "<REPLACE_WITH_module.ingress.certificate_arn>"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
spec:
  rules:
    - host: api.tamendutta.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: order-api
                port:
                  number: 3000
