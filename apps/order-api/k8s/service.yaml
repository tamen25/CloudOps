#This manifest defines service for CloudOps.
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: "${ORDER_API_NAMESPACE}"
  labels:
    app: order-api
spec:
  selector:
    app: order-api
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
  type: ClusterIP
