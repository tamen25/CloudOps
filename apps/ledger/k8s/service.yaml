# ledger ClusterIP service. Reachable in-mesh as
# ledger.${MESH_NAMESPACE}.svc.cluster.local on port 80.
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: ledger
spec:
  selector:
    app: ledger
  ports:
    - name: http
      port: 80
      targetPort: http
