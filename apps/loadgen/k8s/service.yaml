# loadgen control-API service. Reachable in-mesh (and from the storefront BFF)
# as loadgen.${MESH_NAMESPACE}.svc.cluster.local on port 80.
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: loadgen
spec:
  selector:
    app: loadgen
  ports:
    - name: http
      port: 80
      targetPort: http
