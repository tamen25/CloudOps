# loadgen (Node) — control API + traffic runner. Targets only the in-cluster
# api-gateway (GATEWAY_URL). The long-running Deployment serves the control API;
# the trickle CronJob (modules/loadgen) runs the same image with RUN_ON_START.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: loadgen
    mesh.cloudops/lang: node
spec:
  replicas: ${LOADGEN_REPLICAS}
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        mesh.cloudops/lang: node
    spec:
      serviceAccountName: "${LOADGEN_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: loadgen
          image: "${LOADGEN_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: NODE_ENV
              value: "${MESH_ENVIRONMENT}"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL}"
            - name: GATEWAY_URL
              value: "${GATEWAY_URL}"
            # Long-running control API never auto-runs; the CronJob sets these.
            - name: RUN_ON_START
              value: ""
            - name: RUN_RPS
              value: ""
            - name: RUN_DURATION_SECONDS
              value: ""
            - name: INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: mesh-internal
                  key: hmac-secret
                  optional: true
            - name: INTERNAL_HMAC_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: mesh-internal
                  key: hmac-secret-previous
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "loadgen"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
