# payment (Node) — authorize a charge, post to ledger over internal HMAC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: payment
    mesh.cloudops/lang: node
spec:
  replicas: ${PAYMENT_REPLICAS}
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        mesh.cloudops/lang: node
    spec:
      serviceAccountName: "${PAYMENT_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: payment
          image: "${PAYMENT_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          env:
            - name: NODE_ENV
              value: "${MESH_ENVIRONMENT}"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL}"
            - name: LEDGER_URL
              value: "${LEDGER_URL}"
            - name: INTERNAL_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: mesh-internal
                  key: hmac-secret
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "payment"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
