# api-gateway (Node) — mesh edge / trace root. Fans out to downstream
# services. Placeholders rendered by scripts/render-k8s.ts; securityContext
# mirrors order-api (non-root, read-only root FS, drop ALL caps).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: "${MESH_NAMESPACE}"
  labels:
    app: api-gateway
    mesh.cloudops/lang: node
spec:
  replicas: ${API_GATEWAY_REPLICAS}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        mesh.cloudops/lang: node
    spec:
      serviceAccountName: "${API_GATEWAY_SERVICE_ACCOUNT}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: api-gateway
          image: "${API_GATEWAY_IMAGE}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          env:
            - name: NODE_ENV
              value: "${MESH_ENVIRONMENT}"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "${LOG_LEVEL}"
            - name: PRICING_URL
              value: "${PRICING_URL}"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "${OTEL_ENDPOINT}"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: OTEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-auth
                  key: api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
