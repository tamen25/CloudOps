# Builds one image from apps/<image>, pushes it to the foundation stack's ECR
# repository of the same name, scans it, and prints the digest reference for
# the platform stack's tfvars. Called by mesh.yml and loadgen.yml; the same
# job scripts/build-and-push.sh does by hand.
#
# The platform stack deploys these images (mesh_*_image), so this workflow
# never touches the cluster. Tags are immutable in ECR and name the commit.

name: Image Build

on:
  workflow_call:
    inputs:
      image:
        description: Directory under apps/, and the ECR repository key
        required: true
        type: string
      tfvar:
        description: The platform stack variable that takes this image
        required: true
        type: string
      environment:
        description: Environment whose repository receives the image
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    permissions:
      id-token: write   # AWS credentials
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      TFVAR: ${{ inputs.tfvar }}
      TF_VARS: ${{ secrets.TF_VARS }}
      TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
      TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
      TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-image-${{ inputs.image }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false

      - name: Find the ECR repository
        run: |
          bash scripts/write-ci-tfvars.sh
          STACKS=foundation bash scripts/terraform-stacks.sh init
          REPO=$(terraform -chdir=stacks/foundation output -json ecr_repository_urls | jq -r --arg i "$IMAGE" '.[$i] // empty')
          if [ -z "$REPO" ]; then
            echo "::error::no $IMAGE repository in the foundation stack's ecr_repository_urls"
            exit 1
          fi
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # EKS nodes are x86_64 (t3).
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ inputs.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REPO }}:${{ github.sha }}

      - name: Image reference
        run: echo "IMAGE_REF=${REPO}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"

      - name: Scan image (CRITICAL fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Reference for the platform tfvars
        run: |
          {
            echo "### $IMAGE"
            echo
            echo '```hcl'
            echo "$TFVAR = \"$IMAGE_REF\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
