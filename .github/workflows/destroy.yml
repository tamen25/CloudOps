#Required GitHub Actions secrets:
#AWS_GITHUB_ACTIONS_ROLE_ARN  — IAM role ARN from: terraform -chdir=stacks/foundation output -raw github_actions_role_arn
#AWS_REGION                   — AWS region (e.g. us-east-1)
#TF_VARS                      — Full contents of your terraform.tfvars file
#
#GitHub Environment required:
#production  — Settings → Environments → production; add required reviewers
#
#Double-gated: GitHub environment approval + typed confirmation string.
#
#Destroys the layered stacks (stacks/), the layout CI applies, in reverse:
#platform, cluster, foundation. It used to destroy the root layout, a
#different state: on a stacks environment that applied the root first
#(creating a second copy), then deleted the state bucket the stacks' state
#lives in, leaving the real environment running and unmanaged.
#
#With the permissions boundary on (BACKLOG S08), the deployer cannot change
#the bootstrap roles, so the foundation destroy stops at bootstrap; an
#administrator destroys that part (docs/runbooks/security/permissions-boundary.md).

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy-everything' to confirm full teardown"
        required: true
        type: string
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.11.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production  # requires manual approval from configured reviewers
    steps:

      #── 1. Validate confirmation string ────────────────────────────────────
      - name: Validate confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "destroy-everything" ]; then
            echo "::error::Confirmation input was '${{ inputs.confirm }}'"
            echo "::error::Must be exactly: destroy-everything"
            exit 1
          fi
          echo "✓ Confirmation accepted"
          echo "  Environment: ${{ inputs.environment }}"
          echo "  Triggered by: ${{ github.actor }}"

      #── 2–4. Bootstrap ─────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-destroy
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # disable wrapper so terraform output -raw returns clean strings

      #Closes backlog #24 — wire the `environment` input to the tfvars secret
      #and to the state-key derivation. If a per-env secret exists
      #(TF_VARS_DEV / TF_VARS_STAGING / TF_VARS_PROD), use it; otherwise fall
      #back to the shared TF_VARS. The next step asserts the tfvars `environment`
      #field matches `inputs.environment` so a destroy can never run against
      #the wrong state.
      - name: Write terraform.tfvars
        env:
          TF_VARS_ENV: ${{ secrets[format('TF_VARS_{0}', inputs.environment)] }}
          TF_VARS_DEFAULT: ${{ secrets.TF_VARS }}
        run: |
          if [ -n "${TF_VARS_ENV:-}" ]; then
            echo "Using secrets.TF_VARS_${{ inputs.environment }} (per-env tfvars)"
            printf '%s' "$TF_VARS_ENV" > terraform.tfvars
          elif [ -n "${TF_VARS_DEFAULT:-}" ]; then
            echo "Using secrets.TF_VARS (shared)"
            printf '%s' "$TF_VARS_DEFAULT" > terraform.tfvars
          else
            echo "::error::No tfvars secret found — set secrets.TF_VARS or secrets.TF_VARS_${{ inputs.environment }}"
            exit 1
          fi

      - name: Assert tfvars environment matches input
        run: |
          TFVARS_ENV=$(grep '^environment' terraform.tfvars \
            | sed 's/.*= *"\(.*\)".*/\1/' \
            | head -1)
          if [ -z "$TFVARS_ENV" ]; then
            echo "::error::terraform.tfvars is missing the 'environment = ' field"
            exit 1
          fi
          if [ "$TFVARS_ENV" != "${{ inputs.environment }}" ]; then
            echo "::error::Refusing to destroy: inputs.environment is '${{ inputs.environment }}' but terraform.tfvars says environment = '$TFVARS_ENV'"
            echo "::error::Either correct the workflow input, or update the tfvars secret used for this environment."
            exit 1
          fi
          echo "✓ tfvars environment ($TFVARS_ENV) matches input"

      #── 5. Names, from tfvars and the modules' naming ──────────────────────
      #Every bucket the modules create is named "<project_name>-…" (the
      #deployer's S3 scope); the state bucket defaults to
      #<project_name>-tfstate-bucket; the cluster is
      #<project_name>-<environment>-cluster.
      - name: Read names from tfvars
        run: |
          tfvar() { grep -E "^[[:space:]]*$1[[:space:]]*=" terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1; }
          PROJECT=$(tfvar project_name)
          PROJECT=${PROJECT:-cloudops}
          STATE_BUCKET=$(tfvar bootstrap_bucket_name)
          STATE_BUCKET=${STATE_BUCKET:-${PROJECT}-tfstate-bucket}
          {
            echo "PROJECT=$PROJECT"
            echo "STATE_BUCKET=$STATE_BUCKET"
            echo "CLUSTER=${PROJECT}-${{ inputs.environment }}-cluster"
          } >> "$GITHUB_ENV"
          echo "Project: $PROJECT  State bucket: $STATE_BUCKET"

      #── 5. Install bucket-emptying helper ──────────────────────────────────
      #Written once to /usr/local/bin and reused for every project bucket.
      #Handles three cases that `aws s3 rm` alone misses:
      #• versioned objects (bucket versioning enabled)
      #• Glacier-transitioned objects (s3 rm fails; s3api delete-objects succeeds)
      #• delete markers left behind by previous partial deletes
      - name: Install empty-s3-bucket helper
        run: |
          cat > /usr/local/bin/empty-s3-bucket << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          BUCKET=$1
          REGION=${AWS_REGION:-us-east-1}

          if ! aws s3api head-bucket --bucket "$BUCKET" --region "$REGION" 2>/dev/null; then
            echo "  Bucket $BUCKET not found — skipping"
            exit 0
          fi

          echo "Emptying s3://$BUCKET ..."

          #Pass 1 — fast recursive delete for current (non-versioned) objects
          aws s3 rm "s3://$BUCKET" --recursive --region "$REGION" 2>/dev/null || true

          #Pass 2 — delete all object versions in pages of 1000
          #Glacier-transitioned objects are deleted here (s3api delete-objects
          #removes any storage class without requiring a restore first)
          while true; do
            BATCH=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --max-items 1000 \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || echo '{"Objects":[]}')
            COUNT=$(echo "$BATCH" | jq '.Objects | length')
            [ "$COUNT" -eq 0 ] && break
            aws s3api delete-objects \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --delete "$BATCH" > /dev/null
            echo "  Deleted $COUNT version(s)"
          done

          #Pass 3 — delete all delete markers (pagination loop)
          while true; do
            BATCH=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --max-items 1000 \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json 2>/dev/null || echo '{"Objects":[]}')
            COUNT=$(echo "$BATCH" | jq '.Objects | length')
            [ "$COUNT" -eq 0 ] && break
            aws s3api delete-objects \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --delete "$BATCH" > /dev/null
            echo "  Deleted $COUNT delete marker(s)"
          done

          echo "✓ s3://$BUCKET is empty"
          SCRIPT
          chmod +x /usr/local/bin/empty-s3-bucket

      #── 6. Empty the data buckets ──────────────────────────────────────────
      #force_destroy is a variable on every bucket, so Terraform may refuse a
      #bucket with objects in it (Loki, Tempo, Mimir, Thanos, flow logs,
      #CloudTrail, Config). The state bucket is kept until the stacks are gone.
      - name: Empty the project's data buckets
        run: |
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, '${PROJECT}-')].Name" --output text)
          for b in $BUCKETS; do
            [ "$b" = "$STATE_BUCKET" ] && continue
            empty-s3-bucket "$b"
          done

      #── 7. Platform stack ──────────────────────────────────────────────────
      - name: Destroy the platform stack
        run: STACKS=platform bash scripts/terraform-stacks.sh destroy -auto-approve

      #── 8. Load balancers the cluster made ─────────────────────────────────
      #The AWS Load Balancer Controller creates load balancers and target
      #groups for Ingresses and Services, outside Terraform. Left behind they
      #hold ENIs and security groups, and the VPC cannot be deleted.
      - name: Delete the cluster's load balancers and target groups
        run: |
          owned() {
            [ "$(aws elbv2 describe-tags --resource-arns "$1" \
              --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value | [0]" --output text)" = "$CLUSTER" ]
          }
          LBS=""
          for arn in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            if owned "$arn"; then
              echo "Deleting load balancer $arn"
              aws elbv2 delete-load-balancer --load-balancer-arn "$arn"
              LBS="$LBS $arn"
            fi
          done
          if [ -n "$LBS" ]; then
            # shellcheck disable=SC2086 # one argument per ARN
            aws elbv2 wait load-balancers-deleted --load-balancer-arns $LBS
          fi
          for arn in $(aws elbv2 describe-target-groups --query 'TargetGroups[].TargetGroupArn' --output text); do
            if owned "$arn"; then
              echo "Deleting target group $arn"
              aws elbv2 delete-target-group --target-group-arn "$arn"
            fi
          done

      #── 9. Cluster and foundation stacks ───────────────────────────────────
      #Foundation includes bootstrap: the OIDC provider and the role this run
      #holds. Its session stays valid until it expires.
      - name: Destroy the cluster and foundation stacks
        run: STACKS="cluster foundation" bash scripts/terraform-stacks.sh destroy -auto-approve

      #── 10. Delete the Terraform state bucket ───────────────────────────────
      #State bucket was created by create-s3-bucket.sh (outside Terraform), so
      #Terraform destroy does not remove it — we must do so explicitly.
      - name: Empty Terraform state bucket
        run: empty-s3-bucket "$STATE_BUCKET"

      - name: Delete Terraform state bucket
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" 2>/dev/null; then
            aws s3api delete-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            echo "✓ State bucket $STATE_BUCKET deleted"
          else
            echo "State bucket $STATE_BUCKET not found — already deleted or never created"
          fi

      #── 19. Summary ─────────────────────────────────────────────────────────
      - name: Write destroy summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            RESULT="Complete — all infrastructure destroyed"
          else
            ICON="❌"
            RESULT="Failed or incomplete — check failed step above"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${ICON} Infrastructure Destroy — ${RESULT}

          | | |
          |---|---|
          | **Environment** | \`${{ inputs.environment }}\` |
          | **Triggered by** | @${{ github.actor }} |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          **Destroyed, in order:**

          | Step | What |
          |------|------|
          | 1 | Every \`${PROJECT}-*\` bucket except the state bucket emptied |
          | 2 | \`stacks/platform\` destroyed |
          | 3 | Load balancers and target groups of \`${CLUSTER}\` deleted |
          | 4 | \`stacks/cluster\`, then \`stacks/foundation\` (bootstrap included) destroyed |
          | 5 | TF state bucket emptied and deleted: \`$STATE_BUCKET\` |

          $([ "$STATUS" != "success" ] && echo "> ⚠️ Teardown may be incomplete. Run \`STACKS=<stack> scripts/terraform-stacks.sh plan -destroy\` per stack to see what remains, before the state bucket is gone.")
          EOF
