#This manifest defines libraries for CloudOps.
#Required GitHub Actions secrets:
#AWS_GITHUB_ACTIONS_ROLE_ARN  - IAM role ARN from: terraform output -raw bootstrap_github_actions_role_arn
#AWS_REGION                   - AWS region (e.g. us-east-1)
#
#Optional GitHub Actions variables:
#CODEARTIFACT_DOMAIN          - defaults to cloudops-<environment>
#CODEARTIFACT_REPOSITORY      - backward-compatible Node.js repo override
#CODEARTIFACT_NODEJS_REPOSITORY - defaults to cloudops-nodejs
#CODEARTIFACT_JAVA_REPOSITORY   - defaults to cloudops-java
#CODEARTIFACT_DOTNET_REPOSITORY - defaults to cloudops-dotnet
#CODEARTIFACT_PYTHON_REPOSITORY - defaults to cloudops-python
#CODEARTIFACT_DOMAIN_OWNER    - AWS account ID; defaults to caller account
#LIBRARY_PUBLISH_LANGUAGES    - comma-separated publish list; defaults to all
#supported values: all, none, nodejs, java, dotnet, python

name: Library Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'libraries/**'
      - 'scripts/publish-node-packages.sh'
      - 'scripts/publish-java-packages.sh'
      - 'scripts/publish-dotnet-packages.sh'
      - 'scripts/publish-python-packages.sh'
      - '.github/workflows/libraries.yml'
  pull_request:
    branches: [main]
    paths:
      - 'libraries/**'
      - 'scripts/publish-node-packages.sh'
      - 'scripts/publish-java-packages.sh'
      - 'scripts/publish-dotnet-packages.sh'
      - 'scripts/publish-python-packages.sh'
      - '.github/workflows/libraries.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for AWS credentials'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      publish_languages:
        description: 'Optional override: all, none, nodejs, java, dotnet, python'
        required: false
        type: string

permissions:
  contents: read

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN || format('cloudops-{0}', inputs.environment || 'dev') }}
  CODEARTIFACT_NODEJS_REPOSITORY: ${{ vars.CODEARTIFACT_NODEJS_REPOSITORY || vars.CODEARTIFACT_REPOSITORY || 'cloudops-nodejs' }}
  CODEARTIFACT_JAVA_REPOSITORY: ${{ vars.CODEARTIFACT_JAVA_REPOSITORY || 'cloudops-java' }}
  CODEARTIFACT_DOTNET_REPOSITORY: ${{ vars.CODEARTIFACT_DOTNET_REPOSITORY || 'cloudops-dotnet' }}
  CODEARTIFACT_PYTHON_REPOSITORY: ${{ vars.CODEARTIFACT_PYTHON_REPOSITORY || 'cloudops-python' }}
  CODEARTIFACT_DOMAIN_OWNER: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

#Gate: push-to-main runs only fire when the repository variable
#AUTO_RUN_ON_MERGE is set to "true". PR + workflow_dispatch always run.
#Toggle: `gh variable set AUTO_RUN_ON_MERGE --body true` to enable;
#`gh variable delete AUTO_RUN_ON_MERGE` to disable. Default: disabled.
#The 6 *-check jobs and publish-plan are entry-level; the publish-* jobs
#chain through `needs: publish-plan` so they cascade-skip when the gate
#is closed.
jobs:
  nodejs-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check Node package manifests
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_NODEJS_REPOSITORY }}
        run: bash scripts/publish-node-packages.sh --check

      - name: Test Node ${{ matrix.lib }} package with coverage
        working-directory: libraries/nodejs/${{ matrix.lib }}
        run: |
          npm ci
          npm run test:coverage 2>&1 | tee coverage-summary.txt

      #Backlog #66 — make coverage failures inspectable from the Actions UI.
      - name: Upload Node coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-nodejs-${{ matrix.lib }}
          path: libraries/nodejs/${{ matrix.lib }}/coverage-summary.txt
          retention-days: 14
          if-no-files-found: ignore

  java-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java package manifests
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_JAVA_REPOSITORY }}
        run: bash scripts/publish-java-packages.sh --check

      - name: Test Java ${{ matrix.lib }} package with coverage
        working-directory: libraries/java/${{ matrix.lib }}
        run: mvn -q verify

      - name: Upload Java coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-java-${{ matrix.lib }}
          path: |
            libraries/java/${{ matrix.lib }}/target/site/jacoco/
            libraries/java/${{ matrix.lib }}/target/site/jacoco/jacoco.xml
          retention-days: 14
          if-no-files-found: ignore

  dotnet-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Check .NET package manifests
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_DOTNET_REPOSITORY }}
        run: bash scripts/publish-dotnet-packages.sh --check

      #Threshold raised 40 → 45 in #69. Java is at 0.50 (actual ~57%); .NET
      #shape mirrors Java so 45 is a conservative lift with margin. Revert
      #here if a future change drops below the new gate.
      - name: Test .NET ${{ matrix.lib }} package with coverage
        working-directory: libraries/dotnet/${{ matrix.lib }}
        run: >
          dotnet test tests/CloudOps.Otel.${{ matrix.pascal }}.Tests.csproj
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=TestResults/coverage/
          /p:Threshold=45
          /p:ThresholdType=line

      - name: Upload .NET coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dotnet-${{ matrix.lib }}
          path: libraries/dotnet/${{ matrix.lib }}/tests/TestResults/coverage/
          retention-days: 14
          if-no-files-found: ignore

  python-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check Python package manifests
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_PYTHON_REPOSITORY }}
        run: bash scripts/publish-python-packages.sh --check

      - name: Install Python coverage tooling
        run: python -m pip install --upgrade coverage

      # The package's own dependencies (the traces library needs the
      # OpenTelemetry SDK); the tests still import from src/ via PYTHONPATH.
      - name: Install the ${{ matrix.lib }} package dependencies
        run: python -m pip install ./libraries/python/${{ matrix.lib }}

      - name: Run Python ${{ matrix.lib }} tests with coverage
        env:
          PYTHONPATH: libraries/python/${{ matrix.lib }}/src
        run: |
          python -m coverage run --source=libraries/python/${{ matrix.lib }}/src/cloudops_otel_${{ matrix.lib }} -m unittest discover -s libraries/python/${{ matrix.lib }}/tests
          python -m coverage report --fail-under=70 | tee coverage-summary.txt
          python -m coverage xml -o coverage.xml
          python -m coverage html -d htmlcov

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ matrix.lib }}
          path: |
            coverage-summary.txt
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  go-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libraries/go/${{ matrix.lib }}/go.mod
          cache-dependency-path: libraries/go/${{ matrix.lib }}/go.sum

      - name: Run Go ${{ matrix.lib }} tests with coverage
        working-directory: libraries/go/${{ matrix.lib }}
        run: |
          go test -coverprofile coverage.out -covermode atomic -coverpkg github.com/cloudops/otel-${{ matrix.lib }} ./...
          go tool cover -func coverage.out | tee coverage-summary.txt
          go tool cover -html coverage.out -o coverage.html
          coverage="$(go tool cover -func coverage.out | awk '/^total:/ { gsub("%", "", $3); print $3 }')"
          echo "Go line coverage: ${coverage}%"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 75) { printf "Go coverage %.1f%% is below 75%%\n", coverage; exit 1 } }'

      - name: Upload Go coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.lib }}
          path: |
            libraries/go/${{ matrix.lib }}/coverage.out
            libraries/go/${{ matrix.lib }}/coverage.html
            libraries/go/${{ matrix.lib }}/coverage-summary.txt
          retention-days: 14
          if-no-files-found: ignore

  cpp-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lib: logs, pascal: Logs, upper: LOGS }
          - { lib: traces, pascal: Traces, upper: TRACES }
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python for C++ coverage tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install C++ coverage tooling
        run: python -m pip install --upgrade gcovr

      - name: Configure C++ ${{ matrix.lib }}
        run: cmake -S libraries/cpp/${{ matrix.lib }} -B libraries/cpp/${{ matrix.lib }}/build -DCMAKE_BUILD_TYPE=Debug -DCLOUDOPS_${{ matrix.upper }}_ENABLE_COVERAGE=ON

      - name: Build C++ ${{ matrix.lib }}
        run: cmake --build libraries/cpp/${{ matrix.lib }}/build --config Debug

      - name: Run C++ ${{ matrix.lib }} tests
        run: ctest --test-dir libraries/cpp/${{ matrix.lib }}/build --output-on-failure -C Debug

      - name: Check C++ ${{ matrix.lib }} coverage
        run: |
          gcovr \
            --root libraries/cpp/${{ matrix.lib }} \
            --filter libraries/cpp/${{ matrix.lib }}/src \
            --filter libraries/cpp/${{ matrix.lib }}/include \
            --exclude libraries/cpp/${{ matrix.lib }}/tests \
            --exclude libraries/cpp/${{ matrix.lib }}/examples \
            --fail-under-line 50 \
            --print-summary | tee libraries/cpp/${{ matrix.lib }}/coverage-summary.txt
          gcovr \
            --root libraries/cpp/${{ matrix.lib }} \
            --filter libraries/cpp/${{ matrix.lib }}/src \
            --filter libraries/cpp/${{ matrix.lib }}/include \
            --exclude libraries/cpp/${{ matrix.lib }}/tests \
            --exclude libraries/cpp/${{ matrix.lib }}/examples \
            --xml -o libraries/cpp/${{ matrix.lib }}/coverage.xml || true
          gcovr \
            --root libraries/cpp/${{ matrix.lib }} \
            --filter libraries/cpp/${{ matrix.lib }}/src \
            --filter libraries/cpp/${{ matrix.lib }}/include \
            --exclude libraries/cpp/${{ matrix.lib }}/tests \
            --exclude libraries/cpp/${{ matrix.lib }}/examples \
            --html-details libraries/cpp/${{ matrix.lib }}/coverage.html || true

      - name: Upload C++ coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cpp-${{ matrix.lib }}
          path: |
            libraries/cpp/${{ matrix.lib }}/coverage-summary.txt
            libraries/cpp/${{ matrix.lib }}/coverage.xml
            libraries/cpp/${{ matrix.lib }}/coverage.html*
          retention-days: 14
          if-no-files-found: ignore

  publish-plan:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    outputs:
      nodejs: ${{ steps.plan.outputs.nodejs }}
      java: ${{ steps.plan.outputs.java }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      python: ${{ steps.plan.outputs.python }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Resolve publish language list
        id: plan
        env:
          PUBLISH_LANGUAGES: ${{ inputs.publish_languages || vars.LIBRARY_PUBLISH_LANGUAGES || 'all' }}
        shell: bash
        run: |
          raw="${PUBLISH_LANGUAGES:-all}"

          nodejs=false
          java=false
          dotnet=false
          python=false
          saw_token=false
          saw_all=false
          saw_none=false

          raw="${raw//$'\n'/,}"
          raw="${raw//;/,}"
          IFS=',' read -ra tokens <<< "$raw"

          for item in "${tokens[@]}"; do
            token="$(printf '%s' "$item" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$token" ] && continue
            saw_token=true

            case "$token" in
              all|'*')
                saw_all=true
                ;;
              none|skip|off|false)
                saw_none=true
                ;;
              nodejs|node|javascript|js|typescript|ts|npm)
                nodejs=true
                ;;
              java|maven)
                java=true
                ;;
              dotnet|.net|csharp|cs|nuget)
                dotnet=true
                ;;
              python|py|pypi)
                python=true
                ;;
              *)
                echo "::error::Unsupported library publish language '$token'. Use all, none, nodejs, java, dotnet, or python."
                exit 1
                ;;
            esac
          done

          if [ "$saw_none" = "true" ] && { [ "$saw_all" = "true" ] || [ "$nodejs" = "true" ] || [ "$java" = "true" ] || [ "$dotnet" = "true" ] || [ "$python" = "true" ]; }; then
            echo "::error::Use 'none' by itself, not with publish languages."
            exit 1
          fi

          if [ "$saw_token" = "false" ] || [ "$saw_all" = "true" ]; then
            nodejs=true
            java=true
            dotnet=true
            python=true
          fi

          selected=()
          [ "$nodejs" = "true" ] && selected+=("nodejs")
          [ "$java" = "true" ] && selected+=("java")
          [ "$dotnet" = "true" ] && selected+=("dotnet")
          [ "$python" = "true" ] && selected+=("python")

          if [ "${#selected[@]}" -eq 0 ]; then
            selected_text="none"
          else
            selected_text="$(IFS=','; echo "${selected[*]}")"
          fi

          {
            echo "nodejs=$nodejs"
            echo "java=$java"
            echo "dotnet=$dotnet"
            echo "python=$python"
            echo "selected=$selected_text"
          } >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Library Publish Plan

          | | |
          |---|---|
          | **Requested** | \`${raw}\` |
          | **Publishing** | \`${selected_text}\` |
          EOF

  nodejs-publish:
    runs-on: ubuntu-latest
    needs:
      - nodejs-check
      - publish-plan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' && needs.publish-plan.outputs.nodejs == 'true')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-libraries
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Node packages to CodeArtifact
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_NODEJS_REPOSITORY }}
        run: bash scripts/publish-node-packages.sh

      - name: Write summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Library Publish

          | | |
          |---|---|
          | **Language** | Node.js / npm |
          | **Domain** | \`${CODEARTIFACT_DOMAIN}\` |
          | **Repository** | \`${CODEARTIFACT_NODEJS_REPOSITORY}\` |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

  java-publish:
    runs-on: ubuntu-latest
    needs:
      - java-check
      - publish-plan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' && needs.publish-plan.outputs.java == 'true')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-libraries-java
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Java packages to CodeArtifact
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_JAVA_REPOSITORY }}
        run: bash scripts/publish-java-packages.sh

      - name: Write summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Java Library Publish

          | | |
          |---|---|
          | **Language** | Java / Maven |
          | **Domain** | \`${CODEARTIFACT_DOMAIN}\` |
          | **Repository** | \`${CODEARTIFACT_JAVA_REPOSITORY}\` |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

  dotnet-publish:
    runs-on: ubuntu-latest
    needs:
      - dotnet-check
      - publish-plan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' && needs.publish-plan.outputs.dotnet == 'true')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-libraries-dotnet
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish .NET packages to CodeArtifact
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_DOTNET_REPOSITORY }}
        run: bash scripts/publish-dotnet-packages.sh

      - name: Write summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## .NET Library Publish

          | | |
          |---|---|
          | **Language** | .NET / NuGet |
          | **Domain** | \`${CODEARTIFACT_DOMAIN}\` |
          | **Repository** | \`${CODEARTIFACT_DOTNET_REPOSITORY}\` |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

  python-publish:
    runs-on: ubuntu-latest
    needs:
      - python-check
      - publish-plan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' && needs.publish-plan.outputs.python == 'true')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-libraries-python
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Python packages to CodeArtifact
        env:
          CODEARTIFACT_REPOSITORY: ${{ env.CODEARTIFACT_PYTHON_REPOSITORY }}
        run: bash scripts/publish-python-packages.sh

      - name: Write summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Python Library Publish

          | | |
          |---|---|
          | **Language** | Python / PyPI |
          | **Domain** | \`${CODEARTIFACT_DOMAIN}\` |
          | **Repository** | \`${CODEARTIFACT_PYTHON_REPOSITORY}\` |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

  #Closes backlog #123 — single aggregate view of library coverage across
  #all 6 languages. Downloads each per-language `coverage-summary.txt`
  #artifact, extracts the headline number, writes a markdown table to the
  #step summary. Best-effort: missing artifact = "—" (a per-language job
  #may have failed before upload, or coverage uploads may have changed).
  coverage-aggregate:
    runs-on: ubuntu-latest
    needs: [nodejs-check, java-check, dotnet-check, python-check, go-check, cpp-check]
    if: always() && (github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true')
    permissions:
      contents: read
    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage
          pattern: coverage-*
          merge-multiple: false

      - name: Aggregate and summarise
        run: |
          set -euo pipefail
          {
            echo "## Library Coverage Summary"
            echo
            echo "| Language | Line coverage | Gate | Source |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          extract() {
            local lang="$1" file="$2" gate="$3" pattern="$4"
            if [ ! -f "$file" ]; then
              printf '| %s | — | %s | (no artifact) |\n' "$lang" "$gate" >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            local val
            val=$(grep -E "$pattern" "$file" | head -1 | grep -oE '[0-9]+(\.[0-9]+)?%' | head -1 || true)
            if [ -z "$val" ]; then
              val=$(grep -oE '[0-9]+(\.[0-9]+)?%' "$file" | tail -1 || echo "—")
            fi
            # shellcheck disable=SC2016 # the backticks are literal Markdown in the summary table
            printf '| %s | %s | %s | `%s` |\n' "$lang" "${val:-—}" "$gate" "$file" >> "$GITHUB_STEP_SUMMARY"
          }

          for lib in logs traces; do
            extract "Node.js $lib" "coverage/coverage-nodejs-$lib/coverage-summary.txt"   "80%" "Lines"
            extract "Java $lib"    "coverage/coverage-java-$lib/jacoco.xml"               "50%" "line-rate"
            extract ".NET $lib"    "coverage/coverage-dotnet-$lib/coverage.cobertura.xml" "45%" "line-rate"
            extract "Python $lib"  "coverage/coverage-python-$lib/coverage-summary.txt"   "70%" "TOTAL"
            extract "Go $lib"      "coverage/coverage-go-$lib/coverage-summary.txt"       "75%" "^total:"
            extract "C++ $lib"     "coverage/coverage-cpp-$lib/coverage-summary.txt"      "50%" "lines:"
          done
