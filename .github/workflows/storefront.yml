# Storefront pipeline (Next.js on EKS): tests and manifest validation. It
# builds and deploys nothing yet; that needs the storefront's ECR repository,
# IRSA role and certificate first (BACKLOG F01), and will follow app.yml's
# build-and-push and deploy jobs.
#
# Pushes to main run only when the AUTO_RUN_ON_MERGE repository variable is
# true. PRs and manual runs always do.

name: Storefront Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'apps/storefront/**'
      - 'scripts/terraform-stacks.sh'
      - 'scripts/write-ci-tfvars.sh'
      - 'scripts/validate-k8s-manifests.sh'
      - '.github/workflows/storefront.yml'
  pull_request:
    paths:
      - 'apps/storefront/**'
      - 'scripts/terraform-stacks.sh'
      - 'scripts/write-ci-tfvars.sh'
      - 'scripts/validate-k8s-manifests.sh'
      - '.github/workflows/storefront.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    #Gate matches app.yml / infra.yml / libraries.yml — push-to-main only
    #runs when AUTO_RUN_ON_MERGE is true. PR + dispatch always fire.
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install dependencies
        working-directory: apps/storefront
        run: npm ci

      - name: Lint
        working-directory: apps/storefront
        run: npm run lint

      - name: Contract check (process.env reads vs deployment.yaml)
        working-directory: apps/storefront
        run: npm run contract-check

      - name: Unit tests with coverage gate
        working-directory: apps/storefront
        run: npm run test:coverage

      - name: npm audit (high+)
        working-directory: apps/storefront
        run: npm run audit

      - name: Build (production)
        working-directory: apps/storefront
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  manifest-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install storefront deps (for tsx)
        working-directory: apps/storefront
        run: npm ci

      - name: Install order-api deps (for shared validate script)
        working-directory: apps/order-api
        run: npm ci

      - name: Render + validate k8s manifests
        run: bash scripts/validate-k8s-manifests.sh

  notify:
    runs-on: ubuntu-latest
    needs: [test, manifest-validation]
    if: always()
    steps:
      - name: PR summary
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.manifest-validation.result }}" = "success" ]; then
            echo "✅ Storefront PR validation passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Storefront PR validation failed" >> "$GITHUB_STEP_SUMMARY"
          fi
