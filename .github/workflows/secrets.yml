name: Secret Scanning

# gitleaks over the whole history on every PR and every push to main. The
# repository is public, so a committed key is published the moment it is
# pushed; this catches it before merge. Reviewed false positives are listed
# by fingerprint in .gitleaksignore.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # the whole history, not just the tip
      - name: gitleaks
        # The image is pinned by digest (v8.21.2), as actions are pinned by SHA.
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            git /repo --no-banner --redact --exit-code 1
