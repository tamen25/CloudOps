# Load generator pipeline.
# - PR / push: test and build the loadgen source. With AWS_DEPLOY_ENABLED, a
#   push to main also builds the image, pushes it to ECR and prints the
#   mesh_loadgen_image line for the platform tfvars (image-build.yml).
# - workflow_dispatch: an on-demand load run. The loadgen targets the
#   private api-gateway, so the run executes inside the cluster: a one-off
#   Job cloned from the loadgen-trickle CronJob, with the requested
#   scenario, rate and duration. Needs enable_loadgen and
#   loadgen_enable_trickle (both default on with the mesh).

name: Loadgen Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'apps/loadgen/**'
      - 'modules/loadgen/**'
      - '.github/workflows/loadgen.yml'
  pull_request:
    paths:
      - 'apps/loadgen/**'
      - 'modules/loadgen/**'
      - '.github/workflows/loadgen.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the load in'
        required: true
        type: choice
        default: dev
        options: [dev, staging, prod]
      scenario:
        description: 'Load scenario'
        required: true
        type: choice
        default: mixed
        options: [browse, place-order, burst, mixed, chaos]
      rps:
        description: 'Target requests/sec (clamped to 200)'
        required: true
        type: string
        default: '20'
      duration_seconds:
        description: 'Run duration in seconds (clamped to 600)'
        required: true
        type: string
        default: '120'

permissions:
  contents: read

concurrency:
  group: loadgen-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    defaults:
      run:
        working-directory: apps/loadgen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Contract check
        run: npm run contract-check
      - name: Build
        run: npm run build

  image:
    needs: test
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/image-build.yml
    with:
      image: loadgen
      tfvar: mesh_loadgen_image
      environment: dev
    secrets: inherit

  run-load:
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    # In-VPC runner when DEPLOY_RUNNER is set (ADR 025,
    # docs/runbooks/ci-runner.md); GitHub-hosted otherwise.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      SCENARIO: ${{ inputs.scenario }}
      RPS: ${{ inputs.rps }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
      TF_VARS: ${{ secrets.TF_VARS }}
      TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
      TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
      TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
    steps:
      # The loadgen clamps both too; the deadline below needs a number.
      - name: Validate inputs
        run: |
          for v in "$RPS" "$DURATION_SECONDS"; do
            if ! printf '%s' "$v" | grep -Eq '^[0-9]{1,5}$'; then
              echo "::error::rps and duration_seconds must be whole numbers"
              exit 1
            fi
          done
          echo "DURATION=$(( DURATION_SECONDS > 600 ? 600 : DURATION_SECONDS ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-loadgen-run
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false

      - name: Find the cluster and namespace
        run: |
          bash scripts/write-ci-tfvars.sh
          STACKS=cluster bash scripts/terraform-stacks.sh init
          NS=$(sed -nE 's/^mesh_namespace[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' terraform.tfvars | head -1)
          {
            echo "EKS_CLUSTER_NAME=$(terraform -chdir=stacks/cluster output -raw cluster_name)"
            echo "NS=${NS:-cloudops}"
          } >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      # A copy of the trickle Job with this run's scenario, rate and
      # duration, and a deadline a minute past the run.
      - name: Start the run
        run: |
          if ! kubectl -n "$NS" get cronjob loadgen-trickle >/dev/null 2>&1; then
            echo "::error::no loadgen-trickle CronJob in $NS: enable_loadgen and loadgen_enable_trickle must be on"
            exit 1
          fi
          JOB="loadgen-adhoc-${GITHUB_RUN_ID}"
          echo "JOB=$JOB" >> "$GITHUB_ENV"
          kubectl -n "$NS" create job "$JOB" --from=cronjob/loadgen-trickle --dry-run=client -o json \
            | jq --arg s "$SCENARIO" --arg r "$RPS" --arg d "$DURATION" --argjson deadline $(( DURATION + 60 )) '
                .spec.activeDeadlineSeconds = $deadline
                | .spec.template.spec.containers[0].env |= map(
                    if .name == "RUN_ON_START" then .value = $s
                    elif .name == "RUN_RPS" then .value = $r
                    elif .name == "RUN_DURATION_SECONDS" then .value = $d
                    elif .name == "OTEL_SERVICE_NAME" then .value = "loadgen-adhoc"
                    else . end)' \
            | kubectl apply -f -
          echo "Started $JOB: $SCENARIO at $RPS rps for ${DURATION}s"

      - name: Wait for it
        run: |
          if ! kubectl -n "$NS" wait --for=condition=complete "job/$JOB" --timeout="$(( DURATION + 120 ))s"; then
            kubectl -n "$NS" logs "job/$JOB" --tail=100 || true
            echo "::error::$JOB did not complete"
            exit 1
          fi
          kubectl -n "$NS" logs "job/$JOB" --tail=20

      - name: Summary
        if: always()
        run: |
          {
            echo "## Load run — ${{ job.status }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Environment** | \`$TARGET_ENVIRONMENT\` |"
            echo "| **Scenario** | \`$SCENARIO\` |"
            echo "| **Rate** | $RPS rps (the loadgen clamps to 200) |"
            echo "| **Duration** | ${DURATION:-?}s |"
            echo "| **Job** | \`${JOB:-not started}\` in \`${NS:-?}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
