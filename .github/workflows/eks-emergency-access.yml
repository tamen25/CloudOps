name: EKS Emergency Public Access

#Backlog #52 — break-glass path for reaching the EKS API server when the
#private endpoint is the only normally-routable interface and the situation
#does not allow waiting for a private runner / bastion.
#
#Effect: temporarily widens the cluster's public_access_cidrs via the AWS API
#(NOT Terraform — state intentionally stays unchanged so the next regular
#apply re-asserts the private-only configuration). The runner records who
#opened the window, when, the CIDR, and the reason in the run summary.
#
#Inputs reach the scripts through env, never as ${{ }} inside run:, so a
#reason containing shell syntax stays text.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, prod]
      action:
        description: open (widen) or close (revert)
        required: true
        type: choice
        options: [open, close]
      cidr:
        description: Caller IP CIDR — required when action=open. Use a /32.
        required: false
        type: string
        default: ''
      reason:
        description: Justification (incident ID / runbook link). Logged to summary.
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  emergency-access:
    runs-on: ubuntu-latest
    #Production approval gate (closes backlog #52). Dev and staging use their
    #own environments, so the same workflow works for all three.
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLUSTER: ${{ secrets.EKS_CLUSTER_NAME }}
      ACTION: ${{ inputs.action }}
      CIDR: ${{ inputs.cidr }}
      REASON: ${{ inputs.reason }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ -z "$CLUSTER" ]; then
            echo "::error::secrets.EKS_CLUSTER_NAME is empty"; exit 1
          fi
          if [ "$ACTION" = "open" ]; then
            if ! printf '%s' "$CIDR" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}/(3[0-2]|[12][0-9]|[0-9])$'; then
              echo "::error::cidr must be an IPv4 CIDR, e.g. 203.0.113.5/32"; exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: eks-emergency-access-${{ inputs.action }}
          aws-region: ${{ env.AWS_REGION }}

      #Closing turns the public endpoint off; the CIDR list only applies
      #while it is on, so it is left as it was.
      - name: Update the endpoint and wait for it
        run: |
          set -euo pipefail
          if [ "$ACTION" = "open" ]; then
            CONFIG="endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=$CIDR"
          else
            CONFIG="endpointPrivateAccess=true,endpointPublicAccess=false"
          fi
          UPDATE=$(aws eks update-cluster-config --name "$CLUSTER" \
            --resources-vpc-config "$CONFIG" --query 'update.id' --output text)
          echo "Update $UPDATE started"
          STATUS=InProgress
          for _ in $(seq 1 60); do
            STATUS=$(aws eks describe-update --name "$CLUSTER" --update-id "$UPDATE" \
              --query 'update.status' --output text)
            case "$STATUS" in
              Successful) echo "Applied."; exit 0 ;;
              Failed|Cancelled) echo "::error::endpoint update $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::endpoint update still $STATUS after 15 minutes"
          exit 1

      - name: Record it
        if: always()
        run: |
          {
            if [ "$ACTION" = "open" ]; then
              echo "## EKS emergency public access — OPENED"
            else
              echo "## EKS emergency public access — CLOSED"
            fi
            echo
            echo "- Result: ${{ job.status }}"
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Cluster: $CLUSTER"
            [ "$ACTION" = "open" ] && echo "- CIDR: \`$CIDR\`"
            echo "- By: @${{ github.actor }}"
            echo "- Reason: $REASON"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ "$ACTION" = "open" ]; then
              echo "Close it as soon as the work is done: re-run this workflow with action=close."
            else
              echo "The next regular Terraform apply re-asserts the endpoint settings from tfvars."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
