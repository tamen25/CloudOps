name: EKS Emergency Public Access

# Backlog #52 — break-glass path for reaching the prod EKS API server when the
# private endpoint is the only normally-routable interface and the situation
# does not allow waiting for a private runner / bastion.
#
# Effect: temporarily widens the cluster's public_access_cidrs via the AWS API
# (NOT Terraform — state intentionally stays unchanged so the next regular
# apply re-asserts the private-only configuration). The runner records who
# opened the window, when, the CIDR, and the reason in the run summary.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, prod]
      action:
        description: open (widen) or close (revert)
        required: true
        type: choice
        options: [open, close]
      cidr:
        description: Caller IP CIDR — required when action=open. Use a /32.
        required: false
        type: string
        default: ''
      reason:
        description: Justification (incident ID / runbook link). Logged to summary.
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  emergency-access:
    runs-on: ubuntu-latest
    # Production approval gate (closes backlog #52). Staging reuses its own
    # approval path so the same workflow works for both.
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ "${{ inputs.action }}" = "open" ] && [ -z "${{ inputs.cidr }}" ]; then
            echo "::error::cidr is required when action=open"; exit 1
          fi
          if [ "${{ inputs.action }}" = "open" ]; then
            if ! echo "${{ inputs.cidr }}" | grep -Eq '^[0-9.]+/(3[0-2]|2[0-9]|1[0-9]|[0-9])$'; then
              echo "::error::cidr must be valid IPv4 CIDR (e.g. 203.0.113.5/32)"; exit 1
            fi
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: eks-emergency-access-${{ inputs.action }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve cluster name
        id: resolve
        run: |
          set -euo pipefail
          # Convention: <project>-<env>-cluster (matches modules/eks naming).
          CLUSTER="${{ secrets.EKS_CLUSTER_NAME }}"
          if [ -z "$CLUSTER" ]; then
            echo "::error::secrets.EKS_CLUSTER_NAME is empty"; exit 1
          fi
          echo "cluster=$CLUSTER" >> "$GITHUB_OUTPUT"

      - name: Open emergency window
        if: inputs.action == 'open'
        run: |
          set -euo pipefail
          aws eks update-cluster-config \
            --name "${{ steps.resolve.outputs.cluster }}" \
            --resources-vpc-config "endpointPrivateAccess=true,endpointPublicAccess=true,publicAccessCidrs=${{ inputs.cidr }}"

          {
            echo "## EKS emergency public access — OPENED"
            echo
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Cluster: ${{ steps.resolve.outputs.cluster }}"
            echo "- CIDR: \`${{ inputs.cidr }}\`"
            echo "- Opened by: @${{ github.actor }}"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Close it as soon as the work is done by re-running this workflow with action=close."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close emergency window
        if: inputs.action == 'close'
        run: |
          set -euo pipefail
          aws eks update-cluster-config \
            --name "${{ steps.resolve.outputs.cluster }}" \
            --resources-vpc-config "endpointPrivateAccess=true,endpointPublicAccess=false,publicAccessCidrs=[]"

          {
            echo "## EKS emergency public access — CLOSED"
            echo
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Cluster: ${{ steps.resolve.outputs.cluster }}"
            echo "- Closed by: @${{ github.actor }}"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Next regular Terraform apply will re-assert this state from tfvars."
          } >> "$GITHUB_STEP_SUMMARY"
