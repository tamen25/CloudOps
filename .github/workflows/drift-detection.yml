#Drift detection — runs `terraform plan` against each layered stack of
#each active environment, separately. Backlog #59 — replaces the previous
#single-env / legacy-root pass.
#
#Required GitHub Actions secrets:
#AWS_GITHUB_ACTIONS_ROLE_ARN  — IAM role ARN
#AWS_REGION                   — AWS region (e.g. us-east-1)
#TF_VARS_DEV / TF_VARS_STAGING / TF_VARS_PROD
#— Full contents of each environment's terraform.tfvars
#TF_VARS                      — Optional fallback when scoped per GitHub environment
#
#GitHub label required:
#drift  — created automatically on first run if absent

name: Drift Detection

on:
  schedule:
    #Daily 02:00 UTC. GitHub Actions cron is static YAML — to change
    #cadence you edit this line. Closes backlog #122 — operators can also
    #run drift mid-cycle via workflow_dispatch + the inputs below to
    #focus on a single env/stack (effective cadence increase without
    #editing the cron).
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dispatch only — schedule fans out across all envs)'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      stacks:
        description: 'Stacks to plan (space-separated subset of: foundation cluster platform). Empty = all three.'
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.11.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  #Build the env + stack lists at runtime: schedule fan-outs across all envs +
  #all stacks; workflow_dispatch narrows to the operator-selected env and
  #optionally to a stack subset via `inputs.stacks` (closes backlog #122).
  plan-matrix:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.build.outputs.envs }}
      stacks: ${{ steps.build.outputs.stacks }}
    steps:
      - id: build
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'envs=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            requested='${{ inputs.stacks }}'
            if [ -z "$requested" ]; then
              echo 'stacks=["foundation","cluster","platform"]' >> "$GITHUB_OUTPUT"
            else
              json='['
              first=1
              for s in $requested; do
                case "$s" in
                  foundation|cluster|platform) ;;
                  *) echo "::error::unknown stack '$s' (allowed: foundation cluster platform)"; exit 1 ;;
                esac
                if [ "$first" = "1" ]; then first=0; else json="${json},"; fi
                json="${json}\"${s}\""
              done
              json="${json}]"
              echo "stacks=${json}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'envs=["dev","staging","prod"]' >> "$GITHUB_OUTPUT"
            echo 'stacks=["foundation","cluster","platform"]' >> "$GITHUB_OUTPUT"
          fi

  detect-drift:
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    needs: plan-matrix
    # In-VPC runner when DEPLOY_RUNNER is set (ADR 025,
    # docs/runbooks/ci-runner.md); GitHub-hosted otherwise.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.plan-matrix.outputs.envs) }}
        stack: ${{ fromJson(needs.plan-matrix.outputs.stacks) }}
    environment: ${{ matrix.environment == 'prod' && 'production' || matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: drift-${{ matrix.environment }}-${{ matrix.stack }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Write terraform.tfvars
        env:
          #write-ci-tfvars.sh reads TARGET_ENVIRONMENT — set from the matrix
          #value so the scheduled fan-out works without inputs.
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          TF_VARS: ${{ secrets.TF_VARS }}
          TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
          TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
        run: bash scripts/write-ci-tfvars.sh

      - name: terraform init (${{ matrix.stack }})
        run: STACK=${{ matrix.stack }} ./scripts/tf-init.sh

      - name: Run terraform plan (${{ matrix.environment }} / ${{ matrix.stack }})
        id: plan
        run: |
          terraform -chdir=stacks/${{ matrix.stack }} plan -detailed-exitcode -no-color 2>&1 | tee drift-output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          echo "Plan exit code: $PLAN_EXIT  (0=no-drift, 1=error, 2=drift)"

      - name: Manage drift issue (per env+stack)
        if: steps.plan.outputs.exit_code != '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENV_NAME: ${{ matrix.environment }}
          STACK_NAME: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const exitCode = parseInt('${{ steps.plan.outputs.exit_code }}');
            const env = process.env.ENV_NAME;
            const stack = process.env.STACK_NAME;
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const labels = ['drift', `drift-${env}`, `drift-${stack}`];
            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name, color: 'e11d48',
                  description: `Infrastructure drift (${name})`,
                });
              } catch (_) { /* exists */ }
            }

            // Find an open drift issue for this env+stack only — labels are
            // ANDed, so {drift, drift-<env>, drift-<stack>} narrows to one.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: labels.join(','),
              state: 'open', per_page: 1,
            });
            const existing = openIssues[0] || null;

            if (exitCode === 2) {
              let planOutput = fs.readFileSync('drift-output.txt', 'utf8');
              const maxLen = 60000;
              const truncated = planOutput.length > maxLen;
              if (truncated) planOutput = planOutput.substring(0, maxLen);

              const planBlock = [
                '<details>', '<summary>Full plan output</summary>', '',
                '```hcl', planOutput,
                truncated ? '\n... (truncated — see full run log)' : '',
                '```', '</details>',
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: [
                    `## Drift still present — ${today} — ${env}/${stack}`, '',
                    `**Run:** [${context.runNumber}](${runUrl})`, '',
                    planBlock,
                  ].join('\n'),
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `Infrastructure drift detected ${today} — ${env}/${stack}`,
                  body: [
                    `\`terraform plan\` detected drift in **${env}** stack **${stack}**.`, '',
                    `| | |`, `|---|---|`,
                    `| **Date** | ${today} |`,
                    `| **Run** | [${context.runNumber}](${runUrl}) |`, '',
                    '## Remediation',
                    '1. Review the plan output below.',
                    '2. If intentional, run `terraform apply` for that env+stack to reconcile.',
                    '3. If unintentional, revert the manual change or import it.', '',
                    planBlock,
                  ].join('\n'),
                  labels,
                });
              }
            } else if (exitCode === 0 && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `## Drift resolved — ${today} — ${env}/${stack}`, '',
                  `\`terraform plan\` returned **no changes** in this scan.`, '',
                  `**Run:** [${context.runNumber}](${runUrl})`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      - name: Write step summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.plan.outputs.exit_code }}"
          case "$EXIT_CODE" in
            0) ICON="✅"; STATUS="No drift" ;;
            2) ICON="⚠️"; STATUS="Drift detected" ;;
            1) ICON="❌"; STATUS="Plan error" ;;
            *) ICON="❓"; STATUS="Unknown ($EXIT_CODE)" ;;
          esac

          {
            echo "## ${ICON} Drift — ${{ matrix.environment }} / ${{ matrix.stack }} — ${STATUS}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Date | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Exit | \`${EXIT_CODE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EXIT_CODE" = "2" ] || [ "$EXIT_CODE" = "1" ]; then
            {
              echo
              echo '```'
              head -c 8000 drift-output.txt
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
