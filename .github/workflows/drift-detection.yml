# Required GitHub Actions secrets:
#   AWS_GITHUB_ACTIONS_ROLE_ARN  — IAM role ARN from: terraform output -raw bootstrap_github_actions_role_arn
#   AWS_REGION                   — AWS region (e.g. us-east-1)
#   TF_VARS                      — Full contents of your terraform.tfvars file
#
# GitHub label required:
#   drift  — created automatically on first run if absent

name: Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.11.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - uses: actions/checkout@v5

      # ── 2. AWS credentials via OIDC ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-drift-detection
          aws-region: ${{ env.AWS_REGION }}

      # ── 3. Terraform setup ──────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false   # disable wrapper so PIPESTATUS[0] captures terraform's exit code

      # ── 4. Write tfvars and init ─────────────────────────────────────────────
      - name: Write terraform.tfvars
        run: echo "${{ secrets.TF_VARS }}" > terraform.tfvars

      - name: terraform init
        run: ./scripts/tf-init.sh

      # ── 5. Run plan and capture exit code ───────────────────────────────────
      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes (drift)
      # Not using set -o pipefail here — tee's exit code (0) must be the step
      # exit code so the step succeeds; terraform's real exit code is captured
      # via PIPESTATUS[0] and written to step outputs for downstream steps.
      - name: Run terraform plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift-output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          echo "Plan exit code: $PLAN_EXIT  (0=no-drift, 1=error, 2=drift)"

      # ── 6. Manage GitHub issue ───────────────────────────────────────────────
      # Skip if plan returned exit code 1 (terraform error) — nothing to report yet.
      # Exit 0 → close open drift issue if one exists.
      # Exit 2 → open new issue or comment on the existing one.
      - name: Manage drift issue
        if: steps.plan.outputs.exit_code != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const exitCode = parseInt('${{ steps.plan.outputs.exit_code }}');
            const fs     = require('fs');
            const today  = new Date().toISOString().split('T')[0];
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Ensure the 'drift' label exists (idempotent — error if already present is swallowed)
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name:  'drift',
                color: 'e11d48',
                description: 'Infrastructure drift detected by automated scan',
              });
            } catch (_) { /* label already exists */ }

            // Find the most recent open drift issue (if any)
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              labels: 'drift',
              state:  'open',
              per_page: 1,
            });
            const existing = openIssues[0] || null;

            if (exitCode === 2) {
              // ── Drift detected ─────────────────────────────────────────────
              let planOutput = fs.readFileSync('drift-output.txt', 'utf8');
              const maxLen   = 65000;
              const truncated = planOutput.length > maxLen;
              if (truncated) {
                planOutput = planOutput.substring(0, maxLen);
              }

              const planBlock = [
                '<details>',
                '<summary>Full plan output</summary>',
                '',
                '```hcl',
                planOutput,
                truncated ? '\n... (truncated — see full run log for complete output)' : '',
                '```',
                '</details>',
              ].join('\n');

              if (existing) {
                // Comment on the existing open issue
                const commentBody = [
                  `## Drift still present — ${today}`,
                  '',
                  `\`terraform plan\` detected infrastructure drift in the nightly scan.`,
                  '',
                  `**Run:** [${context.runNumber}](${runUrl})`,
                  '',
                  planBlock,
                ].join('\n');

                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: existing.number,
                  body:         commentBody,
                });
                core.info(`Commented on existing drift issue #${existing.number}`);

              } else {
                // Create a new issue
                const issueBody = [
                  `\`terraform plan\` detected that live AWS infrastructure has diverged from the Terraform state.`,
                  '',
                  '## Details',
                  '',
                  `| | |`,
                  `|---|---|`,
                  `| **Date** | ${today} |`,
                  `| **Triggered by** | Nightly drift-detection schedule |`,
                  `| **Run** | [${context.runNumber}](${runUrl}) |`,
                  '',
                  '## Remediation',
                  '',
                  '1. Review the plan output below to identify unexpected changes.',
                  '2. If the drift is intentional, run `terraform apply` to reconcile state.',
                  '3. If the drift is unintentional (manual change outside Terraform), revert the change or import it.',
                  '',
                  planBlock,
                ].join('\n');

                const { data: newIssue } = await github.rest.issues.create({
                  owner:  context.repo.owner,
                  repo:   context.repo.repo,
                  title:  `Infrastructure drift detected ${today}`,
                  body:   issueBody,
                  labels: ['drift'],
                });
                core.info(`Created drift issue #${newIssue.number}: ${newIssue.html_url}`);
              }

            } else if (exitCode === 0) {
              // ── No drift ───────────────────────────────────────────────────
              if (existing) {
                await github.rest.issues.createComment({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: existing.number,
                  body: [
                    `## Drift resolved — ${today}`,
                    '',
                    `\`terraform plan\` returned **no changes** in the nightly scan. Infrastructure is back in sync with state.`,
                    '',
                    `**Run:** [${context.runNumber}](${runUrl})`,
                  ].join('\n'),
                });
                await github.rest.issues.update({
                  owner:        context.repo.owner,
                  repo:         context.repo.repo,
                  issue_number: existing.number,
                  state:        'closed',
                  state_reason: 'completed',
                });
                core.info(`Closed drift issue #${existing.number} — drift resolved`);
              } else {
                core.info('No drift detected and no open drift issue — nothing to do');
              }
            }

      # ── 7. Write step summary ────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.plan.outputs.exit_code }}"

          case "$EXIT_CODE" in
            0)
              ICON="✅"
              STATUS="No drift — infrastructure matches state"
              ;;
            2)
              ICON="⚠️"
              STATUS="Drift detected — live infrastructure differs from Terraform state"
              ;;
            1)
              ICON="❌"
              STATUS="Error — terraform plan failed (exit code 1)"
              ;;
            *)
              ICON="❓"
              STATUS="Unknown exit code: $EXIT_CODE"
              ;;
          esac

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${ICON} Drift Detection — ${STATUS}

          | | |
          |---|---|
          | **Date** | $(date -u '+%Y-%m-%d %H:%M UTC') |
          | **Triggered by** | \`${{ github.event_name }}\` |
          | **Actor** | @${{ github.actor }} |
          | **Terraform exit code** | \`${EXIT_CODE}\` |

          EOF

          if [ "$EXIT_CODE" = "2" ]; then
            echo "### Plan output" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 10000 drift-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> See the GitHub issue created/updated above for the full plan output." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$EXIT_CODE" = "1" ]; then
            echo "### Error output" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -c 10000 drift-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── 8. Fail the job on plan error ────────────────────────────────────────
      # Exit code 2 (drift) intentionally does NOT fail the job — drift is
      # reported as a GitHub issue. Exit code 1 (terraform error) fails the job
      # so the run appears red and triggers normal failure notifications.
      - name: Fail on plan error
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "::error::terraform plan returned exit code 1 — check output above for errors"
          exit 1
