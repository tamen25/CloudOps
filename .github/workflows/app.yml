# Required GitHub Actions secrets:
#   AWS_GITHUB_ACTIONS_ROLE_ARN  — IAM role ARN from: terraform output -raw bootstrap_github_actions_role_arn
#   AWS_REGION                   — AWS region (e.g. us-east-1)
#   ECR_REPOSITORY_URL           — ECR repository URI without tag (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/order-api)
#   EKS_CLUSTER_NAME             — EKS cluster name from: terraform output -raw eks_cluster_name
#   GRAFANA_API_KEY              — Grafana service account token for OTel trace verification
#   TF_VARS                      — Full contents of terraform.tfvars (used to keep app manifest rendering aligned with infra state)
#
# Image signing (Cosign keyless — no secrets required):
#   Signatures are stored in ECR alongside the image using Sigstore's keyless flow.
#   Verification uses the GitHub Actions OIDC identity; no private key or secret is needed.

name: App Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'apps/order-api/**'
  workflow_dispatch:
    inputs:
      override_budget_check:
        description: 'Bypass the error budget gate — use only for hotfixes/security patches (requires justification in commit message)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION:         ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
  EKS_CLUSTER_NAME:   ${{ secrets.EKS_CLUSTER_NAME }}
  IMAGE_TAG:          ${{ github.sha }}
  # Opt JavaScript actions still on Node 20 into the Node 24 runtime (GitHub
  # compatibility shim). Remove once every action listed below is on a release
  # that targets Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Unit tests and dependency audit
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/order-api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/order-api

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: apps/order-api

      - name: Lint source
        run: npm run lint
        working-directory: apps/order-api

      - name: Contract check (manifest env vars ⇄ app)
        run: npm run contract-check
        working-directory: apps/order-api

      - name: Run tests
        run: npm test
        working-directory: apps/order-api

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Kubernetes manifest validation — runs in parallel with build-and-push
  # ─────────────────────────────────────────────────────────────────────────────
  manifest-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Render Kubernetes manifests
        env:
          ORDER_API_NAMESPACE: cloudops
          ORDER_API_SERVICE_ACCOUNT: order-api
          ORDER_API_IRSA_ROLE_ARN: arn:aws:iam::123456789012:role/cloudops-order-api-irsa
          ORDER_API_IMAGE: example.com/order-api:latest
          ORDER_API_ENVIRONMENT: dev
          AWS_REGION: us-east-1
          DB_NAME: cloudops
          DB_SECRET_ARN: arn:aws:secretsmanager:us-east-1:123456789012:secret:cloudops-db
          OTEL_ENDPOINT: https://otel.example.com
          OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,k8s.cluster.name=cloudops-dev-cluster
          ACM_CERT_ARN: arn:aws:acm:us-east-1:123456789012:certificate/example
          ORDER_API_HOST: api.example.com
          API_KEY_SECRET_ARN: ""
        run: node apps/order-api/scripts/render-k8s.js apps/order-api/k8s /tmp/order-api-k8s

      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/download/v0.16.1/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/

      - name: kubeval — strict schema validation
        run: kubeval --strict /tmp/order-api-k8s/*.yaml

      - name: kubectl apply --dry-run=client
        run: |
          export KUBECONFIG=$(mktemp --suffix=.kubeconfig)
          cat > "$KUBECONFIG" <<'KUBECFG'
          apiVersion: v1
          kind: Config
          current-context: mock
          clusters:
          - cluster:
              server: https://localhost:6443
            name: mock
          contexts:
          - context:
              cluster: mock
              user: mock
            name: mock
          users:
          - name: mock
            user: {}
          KUBECFG
          kubectl apply --dry-run=client -f /tmp/order-api-k8s/

      - name: Verify deployment manifest container name
        run: |
          CONTAINER=$(python3 - <<'PY'
          import yaml
          with open("/tmp/order-api-k8s/deployment.yaml") as f:
              doc = yaml.safe_load(f)
          containers = doc["spec"]["template"]["spec"]["containers"]
          print(containers[0]["name"])
          PY
          )
          echo "Container name in deployment.yaml: $CONTAINER"
          if [ "$CONTAINER" != "order-api" ]; then
            echo "::error::Container name is '$CONTAINER' — kubectl set image expects 'order-api'"
            exit 1
          fi
          echo "✓ Container name matches deploy target"

      - name: Verify deployment targets cloudops namespace
        run: |
          NS=$(python3 - <<'PY'
          import yaml
          with open("/tmp/order-api-k8s/deployment.yaml") as f:
              doc = yaml.safe_load(f)
          print(doc.get("metadata", {}).get("namespace", ""))
          PY
          )
          echo "Namespace in deployment.yaml: $NS"
          if [ "$NS" != "cloudops" ]; then
            echo "::error::Namespace is '$NS' — expected 'cloudops'"
            exit 1
          fi
          echo "✓ Namespace matches deploy target"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build, push, sign, attest, and scan Docker image
  #
  # Step order:
  #   1. Build and push to ECR
  #   2. Sign with Cosign keyless (Sigstore — signature stored in ECR)
  #   3. Verify signature immediately after signing
  #   4. Generate SPDX-JSON SBOM with Syft, attach as OCI attestation, upload artifact
  #   5. Scan SBOM with Grype — fail on CRITICAL CVEs that have a fix available
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write      # OIDC for AWS credentials + Cosign keyless signing
      contents: read
      security-events: write  # Grype SARIF upload to GitHub code scanning

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: apps/order-api
          push: true
          tags: |
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Cosign keyless image signing ──────────────────────────────────────────
      # Signs the image in-toto using GitHub Actions OIDC as the identity.
      # The signature and its certificate are stored in ECR alongside the image.
      # No private key or secret is required — the signing identity is:
      #   https://github.com/${{ github.repository }}/.github/workflows/app.yml@refs/heads/main
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          echo "Signing ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"
          cosign sign --yes \
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          echo "✓ Image signed"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github\.com/${{ github.repository }}/\.github/workflows/app\.yml@refs/heads/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          echo "✓ Signature verified"

      # ── Syft SBOM generation and attestation ──────────────────────────────────
      # Generates an SPDX-JSON SBOM from the pushed ECR image.
      # Attaches it as a signed OCI attestation (cosign attest) so it travels
      # with the image and is verifiable at deploy time.
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }} \
            --output spdx-json=sbom.spdx.json
          echo "✓ SBOM written to sbom.spdx.json"

      - name: Attach SBOM attestation to image
        run: |
          cosign attest \
            --predicate sbom.spdx.json \
            --type spdxjson \
            --yes \
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          echo "✓ SBOM attestation attached to ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.IMAGE_TAG }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Post SBOM summary
        run: |
          PKG_COUNT=$(python3 -c "
          import json
          with open('sbom.spdx.json') as f:
              d = json.load(f)
          # spdx-json top-level packages list includes the root image package
          pkgs = d.get('packages', [])
          print(len(pkgs))
          " 2>/dev/null || echo "unknown")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## SBOM Generated (Syft / SPDX-JSON)

          | | |
          |---|---|
          | **Image** | \`${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}\` |
          | **Format** | SPDX-JSON |
          | **Packages** | ${PKG_COUNT} |
          | **Artifact** | \`sbom-${{ env.IMAGE_TAG }}\` (retained 90 days) |
          | **Attestation** | Signed OCI attestation stored in ECR alongside image |

          The SBOM attestation can be verified with:
          \`\`\`
          cosign verify-attestation \\
            --type spdxjson \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          \`\`\`
          EOF

      # ── Grype vulnerability scan against the SBOM ─────────────────────────────
      # Scans only for vulnerabilities that have a fix available (--only-fixed).
      # Fails the job if any CRITICAL fixable CVEs are found (--fail-on critical).
      # SARIF results are uploaded to the repository Security tab.
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan SBOM with Grype
        id: grype
        continue-on-error: true  # allow SARIF upload and summary before failing
        run: |
          grype sbom:sbom.spdx.json \
            --output sarif \
            --file grype-results.sarif \
            --only-fixed \
            --fail-on critical
          echo "grype_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload Grype SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-sbom

      - name: Post Grype failure summary
        if: steps.grype.outcome == 'failure'
        run: |
          # Count CRITICAL fixable findings from SARIF
          CRIT_COUNT=$(python3 -c "
          import json
          with open('grype-results.sarif') as f:
              d = json.load(f)
          runs = d.get('runs', [{}])
          results = runs[0].get('results', []) if runs else []
          crits = [r for r in results if r.get('level') == 'error']
          print(len(crits))
          " 2>/dev/null || echo "unknown")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Grype Scan — CRITICAL Fixable CVEs Found

          | | |
          |---|---|
          | **Image** | \`${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}\` |
          | **Scope** | Fixable vulnerabilities only (\`--only-fixed\`) |
          | **CRITICAL with fix** | **${CRIT_COUNT}** |
          | **Action** | Review the Security tab for full findings — update affected packages before deploying |

          The deploy job has been blocked. SARIF results have been uploaded to the
          repository Security tab (Code scanning alerts → grype-sbom).
          EOF

      - name: Fail job on CRITICAL fixable CVEs
        if: steps.grype.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Trivy image scan — blocks deploy on CRITICAL vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  image-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-scan
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Scan image for CRITICAL vulnerabilities
        id: trivy
        continue-on-error: true  # allow summary step to run before failing
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          exit-code: '1'
          severity: CRITICAL
          format: sarif
          output: trivy-image.sarif

      - name: Upload image scan SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Post scan failure to step summary
        if: steps.trivy.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Image Scan Failed — CRITICAL Vulnerabilities Found

          | | |
          |---|---|
          | **Image** | \`${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}\` |
          | **Severity** | CRITICAL |
          | **Action** | Review the Security tab for full findings — fix before deploying |

          The deploy job has been blocked. SARIF results have been uploaded to the
          repository Security tab (Code scanning alerts).
          EOF

      - name: Fail job on CRITICAL findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Error budget gate — blocks deploy when SLO budget is critically low.
  # Skipped automatically when override_budget_check=true (dispatch only).
  # Skipped gracefully when the SLO module is not yet deployed (no metric data).
  #
  # Budget thresholds:
  #   >= 50%  → green, deployment unblocked
  #   10–49%  → warning posted to summary, deployment continues
  #   <  10%  → deployment blocked; set override_budget_check=true to bypass
  # ─────────────────────────────────────────────────────────────────────────────
  budget-check:
    runs-on: ubuntu-latest
    needs: image-scan
    # Skip this job when the override input is explicitly set to true.
    # For push triggers (no inputs), github.event.inputs.override_budget_check is null,
    # which evaluates to != 'true', so the job runs normally.
    if: ${{ github.event.inputs.override_budget_check != 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-budget-check
          aws-region: ${{ env.AWS_REGION }}

      - name: Check SLO error budget
        run: |
          START_TIME=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Querying CloudWatch ErrorBudgetRemaining for order-api (${START_TIME} → ${END_TIME})..."

          RAW=$(aws cloudwatch get-metric-statistics \
            --namespace CloudOps/SLO \
            --metric-name ErrorBudgetRemaining \
            --dimensions Name=Service,Value=order-api \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --period 300 \
            --statistics Average \
            --output json 2>/dev/null || echo '{"Datapoints":[]}')

          echo "CloudWatch response: $RAW"

          BUDGET=$(echo "$RAW" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          pts = sorted(d.get('Datapoints', []), key=lambda x: x.get('Timestamp', ''))
          if pts:
              print(pts[-1]['Average'])
          else:
              print('')
          " 2>/dev/null || echo "")

          if [ -z "$BUDGET" ] || [ "$BUDGET" = "None" ] || [ "$BUDGET" = "null" ]; then
            echo "No ErrorBudgetRemaining metric found — SLO module likely not deployed yet."
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ℹ️ Budget Check — No Data

          | | |
          |---|---|
          | **Metric** | \`CloudOps/SLO / ErrorBudgetRemaining\` |
          | **Status** | No datapoints in the last 5 minutes |
          | **Action** | None — budget gate skipped |

          This is expected if \`enable_slo = false\` in \`terraform.tfvars\`.
          Deploy the SLO module to activate this gate.
          Deployment proceeding without budget check.
          EOF
            exit 0
          fi

          BUDGET_INT=$(echo "$BUDGET" | python3 -c "import sys; print(int(float(sys.stdin.read().strip())))" 2>/dev/null || echo "0")
          echo "Error budget remaining: ${BUDGET_INT}%"

          if [ "$BUDGET_INT" -lt 10 ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Deployment Blocked — Error Budget Critically Low

          | | |
          |---|---|
          | **Error budget remaining** | **${BUDGET_INT}%** |
          | **Threshold** | < 10% — deployment blocked |
          | **Why** | Deploying non-critical changes while the budget is critically low risks making the SLO breach worse |
          | **Override** | Trigger this workflow manually with \`override_budget_check: true\` — use only for hotfixes or security patches |

          **Next steps:**
          1. Check the [SLO dashboard](https://grafana.${DOMAIN}/d/slo-dashboard) for active burn rate
          2. Follow the [error-budget-exhausted runbook](../docs/runbooks/error-budget-exhausted.md)
          3. If this is a hotfix that will *improve* reliability, re-trigger with override enabled and document the justification
          EOF
            echo "::error::Error budget critically low (${BUDGET_INT}%). Deployment blocked. See the error-budget-exhausted runbook or re-trigger with override_budget_check=true to bypass."
            exit 1

          elif [ "$BUDGET_INT" -lt 50 ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ⚠️ Budget Warning — Error Budget Below 50%

          | | |
          |---|---|
          | **Error budget remaining** | **${BUDGET_INT}%** |
          | **Threshold** | 10–49% — deployment allowed with warning |
          | **Recommendation** | Watch the SLO dashboard after deploy; be ready to roll back if the burn rate increases |

          Deployment is proceeding. Monitor the [SLO dashboard](https://grafana.${DOMAIN}/d/slo-dashboard)
          and the [Burn Rate panel](https://grafana.${DOMAIN}/d/slo-dashboard) after this deploy.
          EOF
            echo "::warning::Error budget at ${BUDGET_INT}% — below 50% threshold. Deployment continues; monitor burn rate after deploy."

          else
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Budget Check — Healthy

          | | |
          |---|---|
          | **Error budget remaining** | **${BUDGET_INT}%** |
          | **Status** | Healthy — deployment unblocked |
          EOF
            echo "Error budget healthy at ${BUDGET_INT}% — deployment unblocked."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Deploy to EKS with automatic rollback on failure.
  # Waits for budget-check (SLO gate), image-scan (security gate), and
  # manifest-validation (schema gate) to pass.
  # budget-check is skipped when override_budget_check=true — a skipped
  # dependency does not block a downstream job in GitHub Actions.
  #
  # Before rolling out, the image signature is verified with Cosign to ensure
  # only images signed by this workflow are deployed to the cluster.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [budget-check, manifest-validation]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-app
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Write terraform.tfvars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          if [ -n "$TF_VARS" ]; then
            printf '%s' "$TF_VARS" > terraform.tfvars
          fi

      - name: Init Terraform for outputs
        run: ./scripts/tf-init.sh

      - name: Load deployment configuration from Terraform state
        run: |
          ORDER_API_URL=$(terraform output -raw order_api_url)
          ORDER_API_HOST=${ORDER_API_URL#https://}
          ORDER_API_HOST=${ORDER_API_HOST#http://}

          ACM_CERT_ARN=$(terraform output -raw acm_certificate_arn)
          DB_SECRET_ARN=$(terraform output -raw database_secret_arn)
          OTEL_ENDPOINT=$(terraform output -raw otel_endpoint)
          ORDER_API_IRSA_ROLE_ARN=$(terraform output -raw order_api_irsa_role_arn)

          ORDER_API_NAMESPACE=$(grep '^order_api_namespace' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || true)
          ORDER_API_SERVICE_ACCOUNT=$(grep '^order_api_service_account' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || true)
          ORDER_API_ENVIRONMENT=$(grep '^environment' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || true)
          DB_NAME=$(grep '^database_name' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || true)

          ORDER_API_NAMESPACE=${ORDER_API_NAMESPACE:-cloudops}
          ORDER_API_SERVICE_ACCOUNT=${ORDER_API_SERVICE_ACCOUNT:-order-api}
          ORDER_API_ENVIRONMENT=${ORDER_API_ENVIRONMENT:-dev}
          DB_NAME=${DB_NAME:-cloudops}

          OTEL_RESOURCE_ATTRIBUTES="deployment.environment=${ORDER_API_ENVIRONMENT},k8s.cluster.name=${EKS_CLUSTER_NAME}"

          API_KEY_SECRET_ARN="${{ secrets.ORDER_API_KEY_SECRET_ARN }}"

          {
            echo "ORDER_API_URL=${ORDER_API_URL}"
            echo "ORDER_API_HOST=${ORDER_API_HOST}"
            echo "ACM_CERT_ARN=${ACM_CERT_ARN}"
            echo "DB_SECRET_ARN=${DB_SECRET_ARN}"
            echo "OTEL_ENDPOINT=${OTEL_ENDPOINT}"
            echo "ORDER_API_IRSA_ROLE_ARN=${ORDER_API_IRSA_ROLE_ARN}"
            echo "ORDER_API_NAMESPACE=${ORDER_API_NAMESPACE}"
            echo "ORDER_API_SERVICE_ACCOUNT=${ORDER_API_SERVICE_ACCOUNT}"
            echo "ORDER_API_ENVIRONMENT=${ORDER_API_ENVIRONMENT}"
            echo "DB_NAME=${DB_NAME}"
            echo "OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES}"
            echo "API_KEY_SECRET_ARN=${API_KEY_SECRET_ARN}"
          } >> "$GITHUB_ENV"

      # ── Signature gate ────────────────────────────────────────────────────────
      # Aborts the deployment if the image does not have a valid Cosign signature
      # from this repository's workflow. Prevents deploying manually-pushed or
      # tampered images even if they slip past ECR access controls.
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        run: |
          echo "Verifying Cosign signature for ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"
          cosign verify \
            --certificate-identity-regexp="https://github\.com/${{ github.repository }}/\.github/workflows/app\.yml@refs/heads/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
          echo "✓ Signature verified — proceeding with deployment"

      - name: Capture current deployment state
        run: |
          PREVIOUS_IMAGE=$(kubectl get deployment order-api -n "$ORDER_API_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "none")
          if kubectl get deployment order-api -n "$ORDER_API_NAMESPACE" >/dev/null 2>&1; then
            echo "DEPLOYMENT_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_EXISTS=false" >> "$GITHUB_ENV"
          fi
          echo "Previous image: $PREVIOUS_IMAGE"
          echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> "$GITHUB_ENV"

      - name: Render Kubernetes manifests
        env:
          ORDER_API_IMAGE: ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}
        run: node apps/order-api/scripts/render-k8s.js apps/order-api/k8s /tmp/order-api-k8s

      - name: Apply manifests and verify rollout
        run: |
          set -e

          echo "Applying manifests for image: ${{ env.ECR_REPOSITORY_URL }}:${{ env.IMAGE_TAG }}"
          kubectl apply -f /tmp/order-api-k8s/

          if ! kubectl rollout status deployment/order-api -n "$ORDER_API_NAMESPACE" --timeout=300s; then
            echo "::error::Rollout failed — initiating automatic rollback to $PREVIOUS_IMAGE"

            if [ "$DEPLOYMENT_EXISTS" = "true" ] && [ "$PREVIOUS_IMAGE" != "none" ]; then
              kubectl rollout undo deployment/order-api -n "$ORDER_API_NAMESPACE"
            # Wait for rollback to settle (best-effort — don't fail if this also times out)
              kubectl rollout status deployment/order-api -n "$ORDER_API_NAMESPACE" --timeout=120s || true

              ROLLED_BACK_TO=$(kubectl get deployment order-api -n "$ORDER_API_NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
            else
              ROLLED_BACK_TO="not-available-on-first-deploy"
            fi

            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Deployment Failed — Automatically Rolled Back

          | | |
          |---|---|
          | **Attempted image** | \`${{ env.IMAGE_TAG }}\` |
          | **Previous image**  | \`$PREVIOUS_IMAGE\` |
          | **Rolled back to**  | \`$ROLLED_BACK_TO\` |
          | **Action required** | Investigate the rollout failure before re-deploying |

          Run \`kubectl describe deployment order-api -n ${ORDER_API_NAMESPACE}\` and
          \`kubectl logs -n ${ORDER_API_NAMESPACE} -l app=order-api --previous\` for details.
          EOF
            exit 1
          fi

          echo "✓ Rollout succeeded"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 7: Integration tests against live endpoints
  # ─────────────────────────────────────────────────────────────────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-integration-test
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - name: Write terraform.tfvars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          if [ -n "$TF_VARS" ]; then
            printf '%s' "$TF_VARS" > terraform.tfvars
          fi

      - name: Init Terraform for outputs
        run: ./scripts/tf-init.sh

      - name: Load integration endpoints
        run: |
          echo "BASE_URL=$(terraform output -raw order_api_url)" >> "$GITHUB_ENV"
          echo "GRAFANA_URL=$(terraform output -raw grafana_url)" >> "$GITHUB_ENV"

      - name: Resolve API key for authenticated endpoints
        env:
          API_KEY_SECRET_ARN: ${{ secrets.ORDER_API_KEY_SECRET_ARN }}
        run: |
          if [ -z "$API_KEY_SECRET_ARN" ]; then
            echo "ORDER_API_KEY_SECRET_ARN secret is not set — tests will run unauthenticated"
            echo "API_KEY=" >> "$GITHUB_ENV"
            exit 0
          fi
          RAW=$(aws secretsmanager get-secret-value --secret-id "$API_KEY_SECRET_ARN" --query SecretString --output text)
          API_KEY=$(printf '%s' "$RAW" | python3 <<'PY'
          import json, sys
          raw = sys.stdin.read()
          try:
              d = json.loads(raw)
              print(d.get('api_key') or d.get('apiKey') or d.get('value') or '')
          except Exception:
              print(raw)
          PY
          )
          echo "::add-mask::$API_KEY"
          echo "API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: "Test 1 — GET /health → 200 with status:ok"
        id: t1
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5"
            BODY=$(curl -sf "$BASE_URL/health" 2>/dev/null || echo "")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health")
            echo "  HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "  Body: $BODY"
              if echo "$BODY" | grep -q '"status"'; then
                echo "✓ PASS: /health returned 200 with status field"
                exit 0
              fi
              echo "✗ FAIL: /health returned 200 but body missing 'status' field"
              echo "  Body was: $BODY"
              exit 1
            fi
            [ "$i" -lt 5 ] && sleep 15
          done
          echo "✗ FAIL: /health did not return 200 after 5 attempts"
          exit 1

      - name: "Test 2 — POST /order → 201 with orderId"
        id: t2
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$BASE_URL/order" \
              -H "Content-Type: application/json" \
              ${API_KEY:+-H "X-Api-Key: $API_KEY"} \
              -d '{"items":[{"name":"test","price":9.99}]}')
            STATUS=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            echo "  HTTP $STATUS"
            echo "  Body: $BODY"
            if [ "$STATUS" = "201" ]; then
              if echo "$BODY" | grep -q '"orderId"\|"id"\|"order_id"'; then
                echo "✓ PASS: POST /order returned 201 with order identifier"
                # Store order ID for downstream assertions
                ORDER_ID=$(echo "$BODY" | python3 -c \
                  "import sys,json; d=json.load(sys.stdin); print(d.get('orderId',d.get('id',d.get('order_id',''))))" 2>/dev/null || echo "")
                echo "ORDER_ID=$ORDER_ID" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "✗ FAIL: POST /order returned 201 but body missing order identifier"
              echo "  Body was: $BODY"
              exit 1
            fi
            [ "$i" -lt 5 ] && sleep 15
          done
          echo "✗ FAIL: POST /order did not return 201 after 5 attempts"
          exit 1

      - name: "Test 3 — GET /orders → 200, object with orders array, count >= 1"
        id: t3
        run: |
          for i in $(seq 1 5); do
            echo "Attempt $i/5"
            BODY=$(curl -sf ${API_KEY:+-H "X-Api-Key: $API_KEY"} "$BASE_URL/orders" 2>/dev/null || echo "")
            STATUS=$(curl -s -o /dev/null ${API_KEY:+-H "X-Api-Key: $API_KEY"} -w "%{http_code}" "$BASE_URL/orders")
            echo "  HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "  Body (first 200 chars): ${BODY:0:200}"
              COUNT=$(echo "$BODY" | python3 -c \
                "import sys,json; d=json.load(sys.stdin); orders=d.get('orders'); print(len(orders) if isinstance(orders,list) else -1)" 2>/dev/null || echo "-1")
              if [ "$COUNT" = "-1" ]; then
                echo "✗ FAIL: GET /orders response is not an object with an orders array"
                exit 1
              fi
              if [ "$COUNT" -ge 1 ]; then
                echo "✓ PASS: GET /orders returned 200 with orders array containing $COUNT item(s)"
                exit 0
              fi
              echo "✗ FAIL: GET /orders returned an empty orders array (expected >= 1 after POST)"
              exit 1
            fi
            [ "$i" -lt 5 ] && sleep 15
          done
          echo "✗ FAIL: GET /orders did not return 200 after 5 attempts"
          exit 1

      - name: "Test 4 — GET /metrics is NOT publicly exposed (security)"
        id: t4
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/metrics")
          echo "  HTTP $STATUS on $BASE_URL/metrics"
          if [ "$STATUS" = "200" ]; then
            echo "✗ FAIL: /metrics is publicly reachable — must be on the internal metrics port only"
            exit 1
          fi
          echo "✓ PASS: /metrics is not publicly reachable (HTTP $STATUS)"

      - name: "Test 5 — Verify OTel traces flowing in Tempo (last 5 min)"
        id: t5
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          END=$(date +%s)
          START=$((END - 300))

          echo "Querying Tempo via Grafana proxy for order-api traces (${START}–${END})..."
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $GRAFANA_API_KEY" \
            "${GRAFANA_URL}/api/datasources/proxy/uid/tempo/api/search?tags=service.name%3Dorder-api&limit=5&start=${START}&end=${END}" \
            2>/dev/null || echo '{"traces":[]}')

          echo "Tempo response: $RESPONSE" | head -c 500

          TRACE_COUNT=$(echo "$RESPONSE" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(len(d.get('traces',d.get('data',[]))))" \
            2>/dev/null || echo "0")

          echo "Traces found in last 5 minutes: $TRACE_COUNT"

          if [ "$TRACE_COUNT" -ge 1 ]; then
            echo "✓ PASS: $TRACE_COUNT trace(s) found for order-api in Tempo"
            exit 0
          fi
          echo "✗ FAIL: No traces found for order-api in Tempo in the last 5 minutes"
          echo "  Verify the OTel Collector is running and otel-auth secret is present in the cloudops namespace"
          exit 1

      - name: Write integration test summary
        if: always()
        run: |
          T1="${{ steps.t1.outcome }}"
          T2="${{ steps.t2.outcome }}"
          T3="${{ steps.t3.outcome }}"
          T4="${{ steps.t4.outcome }}"
          T5="${{ steps.t5.outcome }}"

          pass_icon() { [ "$1" = "success" ] && echo "✅ Pass" || echo "❌ Fail"; }

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Integration Test Results

          | Test | Endpoint | Assertion | Result |
          |------|----------|-----------|--------|
          | 1 | \`GET /health\` | HTTP 200, body contains \`status\` field | $(pass_icon "$T1") |
          | 2 | \`POST /order\` | HTTP 201, body contains order identifier | $(pass_icon "$T2") |
          | 3 | \`GET /orders\` | HTTP 200, object with \`orders\` array and ≥1 item | $(pass_icon "$T3") |
          | 4 | \`GET /metrics\` (public) | HTTP != 200 — must not be publicly reachable | $(pass_icon "$T4") |
          | 5 | Tempo traces | ≥1 trace for \`order-api\` in last 5 min | $(pass_icon "$T5") |

          | | |
          |---|---|
          | **Image** | \`${{ env.IMAGE_TAG }}\` |
          | **Cluster** | \`${{ env.EKS_CLUSTER_NAME }}\` |
          | **Run** | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF

      # ── Security posture check ─────────────────────────────────────────────────
      # Non-blocking: queries CloudWatch for open CRITICAL security findings
      # introduced since the deploy. Posts a warning to the step summary if any
      # are found, but does NOT fail the pipeline.
      # Skips gracefully when the security module is not yet deployed.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Security posture check
        if: always()
        continue-on-error: true
        run: |
          START_TIME=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "Querying CloudWatch FindingsOpen{Severity=CRITICAL} (${START_TIME} → ${END_TIME})..."

          RAW=$(aws cloudwatch get-metric-statistics \
            --namespace CloudOps/Security \
            --metric-name FindingsOpen \
            --dimensions Name=Severity,Value=CRITICAL \
            --start-time "$START_TIME" \
            --end-time "$END_TIME" \
            --period 600 \
            --statistics Maximum \
            --output json 2>/dev/null || echo '{"Datapoints":[]}')

          CRITICAL_COUNT=$(echo "$RAW" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          pts = sorted(d.get('Datapoints', []), key=lambda x: x.get('Timestamp', ''))
          if pts:
              print(int(pts[-1].get('Maximum', 0)))
          else:
              print(-1)
          " 2>/dev/null || echo "-1")

          echo "CRITICAL findings open: ${CRITICAL_COUNT}"

          if [ "$CRITICAL_COUNT" = "-1" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ℹ️ Security Posture — No Data

          | | |
          |---|---|
          | **Metric** | \`CloudOps/Security / FindingsOpen{Severity=CRITICAL}\` |
          | **Status** | No datapoints — security module likely not deployed |
          | **Action** | None — check skipped |

          This is expected if \`enable_security = false\` in \`terraform.tfvars\`.
          EOF
          elif [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::warning::${CRITICAL_COUNT} CRITICAL security finding(s) are currently open. Review the Security Posture dashboard."
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ⚠️ Security Posture — CRITICAL Findings Open

          | | |
          |---|---|
          | **CRITICAL findings open** | **${CRITICAL_COUNT}** |
          | **Window** | Last 10 minutes |
          | **Dashboard** | [Security Posture](https://grafana.${DOMAIN}/d/security-posture) |
          | **Action** | Review findings — this deploy did not block but findings require investigation |

          Check the [Security Posture dashboard](https://grafana.${DOMAIN}/d/security-posture) and
          the [compliance-critical-finding runbook](docs/runbooks/security/compliance-critical-finding.md)
          for remediation steps.
          EOF
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Security Posture — Clean

          | | |
          |---|---|
          | **CRITICAL findings open** | 0 |
          | **Window** | Last 10 minutes |
          | **Status** | No open CRITICAL findings detected post-deploy |
          EOF
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 8: Pipeline summary — always runs
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, image-scan, budget-check, deploy, integration-test]
    if: always()
    steps:
      - name: Write pipeline summary
        run: |
          OVERRIDE="${{ github.event.inputs.override_budget_check }}"
          BUDGET_RESULT="${{ needs.budget-check.result }}"

          if [[ "${{ needs.integration-test.result }}" == "success" ]]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Deployment Successful

          | | |
          |---|---|
          | **Image tag**        | \`${{ env.IMAGE_TAG }}\` |
          | **Cluster**          | \`${{ env.EKS_CLUSTER_NAME }}\` |
          | **Integration tests** | All passed ✓ |
          | **Budget gate**      | ${BUDGET_RESULT} ${OVERRIDE:+— override was active} |
          EOF
          else
            FAILED=""
            [[ "${{ needs.build-and-push.result }}"   == "failure" ]] && FAILED="build-and-push"
            [[ "${{ needs.image-scan.result }}"        == "failure" ]] && FAILED="image-scan"
            [[ "${{ needs.budget-check.result }}"      == "failure" ]] && FAILED="budget-check (error budget critically low)"
            [[ "${{ needs.deploy.result }}"            == "failure" ]] && FAILED="deploy"
            [[ "${{ needs.integration-test.result }}"  == "failure" ]] && FAILED="integration-test"
            [[ -z "$FAILED" ]] && FAILED="(skipped or cancelled)"

            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Deployment Failed

          | | |
          |---|---|
          | **Failed job** | \`${FAILED}\` |
          | **Image tag**  | \`${{ env.IMAGE_TAG }}\` |
          | **Run**        | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF
          fi
