#This manifest defines infra for CloudOps.
#Required GitHub Actions secrets:
#AWS_GITHUB_ACTIONS_ROLE_ARN  — IAM role ARN from: terraform output -raw bootstrap_github_actions_role_arn
#AWS_REGION                   — AWS region (e.g. us-east-1)
#INFRACOST_API_KEY            — From https://www.infracost.io/docs/#2-get-api-key
#PLURALITH_API_KEY            — From https://app.pluralith.com (free account)
#TF_VARS_DEV / TF_VARS_STAGING / TF_VARS_PROD
#— Full contents of each environment's terraform.tfvars
#TF_VARS                      — Optional fallback when scoped as a GitHub environment secret
#
#GitHub Environment required:
#production  — Settings → Environments → production; add required reviewers as the approval gate

name: Infra Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'stacks/**'
      - 'scripts/tf-init.sh'
      - 'scripts/terraform-stacks.sh'
      - 'scripts/write-ci-tfvars.sh'
      - 'scripts/build-lambdas.sh'
      - '*.tf'
      - '.github/workflows/infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modules/**'
      - 'stacks/**'
      - 'scripts/tf-init.sh'
      - 'scripts/terraform-stacks.sh'
      - 'scripts/write-ci-tfvars.sh'
      - 'scripts/build-lambdas.sh'
      - '*.tf'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: 1.11.0
  LEGACY_ROOT_APPLY: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  #─────────────────────────────────────────────────────────────────────────────
  #Job 1: Static quality — formatting, validation, lint, tfsec, lock file check
  #─────────────────────────────────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    #Gate: push-to-main runs only fire when the repository variable
    #AUTO_RUN_ON_MERGE is set to "true". PR + workflow_dispatch always run.
    #Toggle: `gh variable set AUTO_RUN_ON_MERGE --body true` to enable;
    #`gh variable delete AUTO_RUN_ON_MERGE` to disable. Default: disabled.
    #All downstream jobs `needs: quality` (or chain through it), so disabling
    #here cascade-skips the entire pipeline on merge.
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Build Lambda dependencies
        #Closes backlog #20 — Terraform no longer runs npm install during apply.
        run: bash scripts/build-lambdas.sh

      # Every Lambda that defines a test script; the dependencies come from
      # the build step above. The self-healing and remediation Lambdas change
      # live resources, and their tests pin down what they change and when.
      - name: Lambda unit tests
        run: |
          for pkg in $(git ls-files 'modules/**/package.json'); do
            if node -e "process.exit(require('./$pkg').scripts?.test ? 0 : 1)"; then
              echo "npm test in $(dirname "$pkg")"
              (cd "$(dirname "$pkg")" && npm test)
            fi
          done

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no backend — providers needed for validate)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Init layered stacks (no backend)
        run: |
          terraform -chdir=stacks/foundation init -backend=false
          terraform -chdir=stacks/cluster init -backend=false
          terraform -chdir=stacks/platform init -backend=false

      - name: Validate layered stacks
        run: |
          terraform -chdir=stacks/foundation validate
          terraform -chdir=stacks/cluster validate
          terraform -chdir=stacks/platform validate

      - name: Permissions boundary on every role
        run: bash scripts/check-permissions-boundary.sh

      - name: Terraform module tests
        run: |
          for dir in $(git ls-files 'modules/*/tests/*.tftest.hcl' | cut -d/ -f1-2 | sort -u); do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
          done

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint init
        run: tflint --init

      - name: tflint
        #--config is required when running --recursive so the root .tflint.hcl
        #(e.g. the disable for terraform_required_providers) is honored inside
        #every child module. Closes backlog #31 — without it, child modules
        #re-enable the recommended preset and emit ~30 noisy warnings.
        run: tflint --recursive --config="$(pwd)/.tflint.hcl" --minimum-failure-severity=error

      - name: actionlint — workflow lint
        #Closes backlog #23 — catches typos / wrong action input names /
        #shellcheck violations in run: blocks before they ship.
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- 1.7.4
          ./actionlint -color

      #Closes backlog #39 — pinned version (was unpinned `@v1.0.0` is fine
      #but documenting the digest pin policy here) and made tfsec a hard gate
      #for HIGH/CRITICAL findings. Documented suppressions live in `.tfsec/`
      #config (`exclude` keys per check); no findings should slip through
      #silently anymore. `soft_fail: false` is the default; making it
      #explicit so a future contributor can't flip it back without reviewing.
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          soft_fail: false
          format: sarif
          additional_args: --minimum-severity HIGH
          # Without a token the action looks up the tfsec release anonymously
          # and fails when the runner's IP is rate-limited.
          github_token: ${{ github.token }}

      - name: Upload tfsec results (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: tfsec-results
          path: results.sarif
          retention-days: 30

  #─────────────────────────────────────────────────────────────────────────────
  #Job 2: Cost estimation — PR events only
  #Compares base branch vs PR branch; fails if monthly cost increases > $50.
  #Infracost prices the HCL itself (no AWS credentials), but needs its own API
  #key: it runs when the INFRACOST_ENABLED repository variable is true and the
  #INFRACOST_API_KEY secret is set.
  #─────────────────────────────────────────────────────────────────────────────
  cost:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request' && vars.INFRACOST_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Breakdown — base branch
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          infracost breakdown --path . --format json --out-file /tmp/infracost-base.json

      - name: Breakdown — PR branch
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          infracost breakdown --path . --format json --out-file /tmp/infracost-pr.json

      - name: Generate diff
        run: |
          infracost diff \
            --path . \
            --compare-to /tmp/infracost-base.json \
            --format json \
            --out-file /tmp/infracost-diff.json

      - name: Enforce cost threshold ($50/month max increase)
        run: |
          DIFF=$(jq -r '.diffTotalMonthlyCost // "0"' /tmp/infracost-diff.json)
          DIFF=${DIFF:-0}
          echo "Monthly cost change: \$$DIFF"
          if (( $(echo "${DIFF} > 50" | bc -l) )); then
            echo "::error::Cost increase of \$${DIFF}/month exceeds the \$50 threshold — review resources before merging"
            exit 1
          fi
          echo "✓ Cost change (\$$DIFF/month) is within the \$50 threshold"

      - name: Post PR cost comment
        uses: infracost/actions/comment@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          path: /tmp/infracost-diff.json
          behavior: update

  #─────────────────────────────────────────────────────────────────────────────
  #Job 3: Terraform plan — all triggers
  #─────────────────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    needs: quality
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request')
    permissions:
      id-token: write
      contents: read
    #On a fresh deploy the EKS cluster doesn't exist yet, so data sources
    #for EKS endpoint/auth fail during plan. The apply stages deploy in the
    #correct order and succeed regardless; plan is informational only.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build Lambda dependencies
        #Closes backlog #20 — Lambda zips need node_modules in place before
        #`terraform plan` so `data.archive_file` builds the correct artifact.
        run: bash scripts/build-lambdas.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Write terraform.tfvars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
          TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
        run: bash scripts/write-ci-tfvars.sh

      - name: terraform plan (layered stacks)
        id: plan
        shell: bash
        env:
          #Closes backlog #120 — exit 2 from -detailed-exitcode = drift, not failure.
          TF_PLAN_DETAILED_EXITCODE: '1'
        run: |
          set -o pipefail
          #Plan foundation -> cluster -> platform against separate state keys.
          set +e
          bash scripts/terraform-stacks.sh plan -lock=false -out=tfplan -no-color \
            2>&1 | tee plan-output.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = "2" ]; then
            echo "::warning::Terraform plan reports drift / pending changes — review plan-output.txt"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: stacks/**/tfplan
          retention-days: 5

  #Job 5: Security scan — Trivy (hard fail on HIGH/CRITICAL) + Checkov.
  security-scan:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      #Closes backlog #39 — Trivy was previously pinned to the mutable
      #`@master` ref. Now pinned to a tagged release; HIGH/CRITICAL findings
      #are a hard gate (continue-on-error removed). To suppress an
      #intentional finding, add a `# trivy:ignore:<id>` comment in the TF
      #source and document the reason in PROJECT_EXPLAINER or a runbook.
      - name: Run Trivy on Terraform config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: '1'
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          # With SARIF output the action drops the severity filter unless
          # this is set, so a LOW finding would fail the gate.
          limit-severities-for-sarif: true

      - name: Upload Trivy results (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

      - name: Install Checkov
        #Pin checkov so a midnight upstream release can't change scan results.
        run: pip install checkov==3.2.298 --quiet

      - name: Run Checkov (HIGH/CRITICAL hard gate)
        #Closes backlog #39 — was previously `|| true` (informational).
        #Now fails the job on HIGH/CRITICAL. Use a `.checkov.yml` skip-check
        #entry to document any intentional suppressions.
        run: |
          checkov -d . --framework terraform --output github_failed_only --check HIGH,CRITICAL

  #─────────────────────────────────────────────────────────────────────────────
  #Job 5: Manifest validation — kubeconform schema validation
  #Validates all Kubernetes manifests in apps/order-api/k8s/ against the
  #upstream JSON schemas. CRD kinds (ServiceMonitor) are skipped, not errored.
  #Runs in parallel with plan.
  #─────────────────────────────────────────────────────────────────────────────
  manifest-validation:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The manifests are templates (replicas: ${ORDER_API_REPLICAS}, …):
      # they are only valid once rendered, so validate through the shared
      # script, which renders order-api, storefront and the mesh services
      # with placeholder values and runs kubeconform on the result.
      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install the renderers' dependencies
        run: |
          for app in order-api storefront api-gateway; do
            npm ci --prefix "apps/$app"
          done

      - name: Render and validate the manifests
        run: bash scripts/validate-k8s-manifests.sh

  #─────────────────────────────────────────────────────────────────────────────
  #Job 7: Manual approval gate — push to main only
  #Gate also waits for security-scan and manifest-validation to pass.
  #Configure the "production" GitHub Environment with required reviewers in
  #repo Settings → Environments → production.
  #─────────────────────────────────────────────────────────────────────────────
  approve:
    runs-on: ubuntu-latest
    needs: [plan, security-scan, manifest-validation]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    steps:
      - name: Awaiting approval
        run: echo "Waiting for ${{ env.TARGET_ENVIRONMENT }} approval via GitHub environment protection"

  #─────────────────────────────────────────────────────────────────────────────
  #Job 8: Terraform apply — staged to match scripts/deploy.sh order
  #Runs fresh targeted applies (saved plan files are incompatible with -target).
  #After final apply, key outputs are posted to the step summary.
  #─────────────────────────────────────────────────────────────────────────────
  apply:
    runs-on: ubuntu-latest
    needs: approve
    if: vars.AWS_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build Lambda dependencies
        #Closes backlog #20 — Lambda zips need node_modules in place before
        #any `terraform apply` so the zips are deterministic + complete.
        run: bash scripts/build-lambdas.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Write terraform.tfvars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
          TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
          TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
          TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
        run: bash scripts/write-ci-tfvars.sh

      - name: Apply layered Terraform stacks
        run: bash scripts/terraform-stacks.sh apply -auto-approve

      #Legacy root recovery/import path. Kept gated off so normal applies use
      #layered states only; enable by editing LEGACY_ROOT_APPLY for a one-off
      #migration recovery run.
      - name: Release stale state lock
        if: env.LEGACY_ROOT_APPLY == '1'
        #Terraform 1.11 S3 native locking stores the lock as <key>.tflock.
        #A cancelled plan or apply leaves this file behind and blocks the next run.
        #Safe to delete here because apply steps are sequential within this job.
        run: |
          BOOTSTRAP_BUCKET=$(grep '^bootstrap_bucket_name' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1)
          if [ -z "$BOOTSTRAP_BUCKET" ]; then
            echo "bootstrap_bucket_name missing from terraform.tfvars — skipping stale lock check"
            exit 0
          fi
          if aws s3api head-object \
               --bucket "$BOOTSTRAP_BUCKET" \
               --key main/terraform.tfstate.tflock 2>/dev/null; then
            echo "Stale lock found — releasing..."
            aws s3 rm "s3://$BOOTSTRAP_BUCKET/main/terraform.tfstate.tflock"
            echo "Lock released"
          else
            echo "No stale lock present"
          fi

      #Import OIDC provider and GitHub Actions IAM role if they were pre-created
      #by scripts/oidc.sh. Uses -var overrides so the Kubernetes provider (which requires
      #a live EKS cluster) stays unconfigured during import of IAM resources.
      #Checks state first — skips import if resource is already tracked.
      - name: Import pre-existing OIDC bootstrap resources
        if: env.LEGACY_ROOT_APPLY == '1'
        run: |
          OIDC_ARN=$(aws iam list-open-id-connect-providers \
            --query "OpenIDConnectProviderList[?ends_with(Arn,'token.actions.githubusercontent.com')].Arn" \
            --output text 2>/dev/null || echo "")

          if [ -n "$OIDC_ARN" ] && [ "$OIDC_ARN" != "None" ]; then
            OIDC_ADDR="module.bootstrap[0].aws_iam_openid_connect_provider.github"
            if terraform state list 2>/dev/null | grep -qF "$OIDC_ADDR"; then
              echo "OIDC provider already in Terraform state — skipping import"
            else
              echo "Importing OIDC provider: $OIDC_ARN"
              terraform import \
                -var 'enable_ingress=false' \
                -var 'enable_observability=false' \
                -var 'enable_security=false' \
                "$OIDC_ADDR" "$OIDC_ARN" \
                || echo "Warning: OIDC import failed (may already be managed elsewhere)"
            fi
          fi

          PROJECT_NAME=$(grep '^project_name' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || echo "cloudops")
          PROJECT_NAME="${PROJECT_NAME:-cloudops}"
          ROLE_NAME="${PROJECT_NAME}-github-actions"
          ROLE_ADDR="module.bootstrap[0].aws_iam_role.github_actions"

          if aws iam get-role --role-name "$ROLE_NAME" --output text >/dev/null 2>&1; then
            if terraform state list 2>/dev/null | grep -qF "$ROLE_ADDR"; then
              echo "GitHub Actions role already in Terraform state — skipping import"
            else
              echo "Importing GitHub Actions role: $ROLE_NAME"
              terraform import \
                -var 'enable_ingress=false' \
                -var 'enable_observability=false' \
                -var 'enable_security=false' \
                "$ROLE_ADDR" "$ROLE_NAME" \
                || echo "Warning: role import failed (may already be managed elsewhere)"
            fi
          fi

      - name: Import pre-existing networking resources
        if: env.LEGACY_ROOT_APPLY == '1'
        run: |
          PROJECT_NAME=$(grep '^project_name' terraform.tfvars | sed 's/.*= *"\(.*\)".*/\1/' | head -1 || echo "cloudops")
          PROJECT_NAME="${PROJECT_NAME:-cloudops}"
          SUBNET_GROUP_NAME="${PROJECT_NAME}-db-subnet-group"
          SUBNET_GROUP_ADDR="module.networking[0].aws_db_subnet_group.main"

          if aws rds describe-db-subnet-groups \
               --db-subnet-group-name "$SUBNET_GROUP_NAME" \
               --output text >/dev/null 2>&1; then
            if terraform state list 2>/dev/null | grep -qF "$SUBNET_GROUP_ADDR"; then
              echo "DB subnet group already in Terraform state — skipping import"
            else
              echo "Importing DB subnet group: $SUBNET_GROUP_NAME"
              terraform import \
                -var 'enable_ingress=false' \
                -var 'enable_observability=false' \
                -var 'enable_security=false' \
                "$SUBNET_GROUP_ADDR" "$SUBNET_GROUP_NAME" \
                || echo "Warning: DB subnet group import failed"
            fi
          else
            echo "DB subnet group does not exist in AWS — skipping import"
          fi

      #Staged applies match scripts/deploy.sh ordering.
      #Each stage runs a fresh plan+apply for the targeted modules.
      #terraform apply -target cannot be combined with a saved plan file.
      - name: Apply bootstrap + networking + dns
        if: env.LEGACY_ROOT_APPLY == '1'
        #Disable ingress/observability vars so the EKS data source (count guard)
        #stays at 0 — EKS cluster doesn't exist yet at this stage.
        #module.dns is included here so the Route53 zone exists before module.ingress
        #references module.dns[0].zone_id in the ingress apply step.
        run: |
          terraform apply \
            -target=module.bootstrap -target=module.networking -target=module.dns \
            -var 'enable_ingress=false' -var 'enable_observability=false' \
            -auto-approve

      - name: Apply EKS
        if: env.LEGACY_ROOT_APPLY == '1'
        #Same guard — EKS cluster is being created here, not yet queryable.
        run: |
          terraform apply \
            -target=module.eks \
            -var 'enable_ingress=false' -var 'enable_observability=false' \
            -auto-approve

      - name: Apply ingress
        if: env.LEGACY_ROOT_APPLY == '1'
        run: terraform apply -target=module.ingress -auto-approve

      - name: Debug LBC pods (on ingress failure)
        if: env.LEGACY_ROOT_APPLY == '1'
        run: |
          CLUSTER=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          if [ -n "$CLUSTER" ]; then
            aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
            echo "=== LBC pod describe ==="
            kubectl -n kube-system describe pods \
              -l app.kubernetes.io/name=aws-load-balancer-controller || true
            echo "=== LBC pod logs ==="
            kubectl -n kube-system logs \
              -l app.kubernetes.io/name=aws-load-balancer-controller \
              --tail=100 || true
          fi

      - name: Apply observability
        if: env.LEGACY_ROOT_APPLY == '1'
        run: terraform apply -target=module.observability -auto-approve

      - name: Apply security
        if: env.LEGACY_ROOT_APPLY == '1'
        run: terraform apply -target=module.security -auto-approve

      - name: Apply database
        if: env.LEGACY_ROOT_APPLY == '1'
        run: terraform apply -target=module.database -auto-approve

      - name: Final sync
        if: env.LEGACY_ROOT_APPLY == '1'
        run: terraform apply -auto-approve

      #NOTE: order-api is deployed by .github/workflows/app.yml — that
      #workflow owns build, sign, scan, render, apply, rollout, integration
      #tests, and rollback. infra.yml only provisions platform prerequisites
      #(cluster, IRSA, ACM, DNS, observability, security, database, OTel).
      #Closes backlog #18.

      - name: Capture and summarize outputs
        if: always()
        run: |
          #Capture outputs — suppress error if no outputs exist yet
          terraform -chdir=stacks/foundation output -json > foundation-outputs.json 2>/dev/null || echo '{}' > foundation-outputs.json
          terraform -chdir=stacks/cluster output -json > cluster-outputs.json 2>/dev/null || echo '{}' > cluster-outputs.json
          terraform -chdir=stacks/platform output -json > platform-outputs.json 2>/dev/null || echo '{}' > platform-outputs.json

          ORDER_API_URL=$(jq -r '.order_api_url.value   // "not deployed"' platform-outputs.json)
          GRAFANA_URL=$(jq -r   '.grafana_url.value      // "not deployed"' platform-outputs.json)
          OTEL_ENDPOINT=$(jq -r '.otel_endpoint.value    // "not deployed"' platform-outputs.json)
          EKS_CLUSTER=$(jq -r   '.cluster_name.value     // "not deployed"' cluster-outputs.json)
          VPC_ID=$(jq -r        '.vpc_id.value           // "not deployed"' foundation-outputs.json)
          SCANNER_ARN=$(jq -r   '.compliance_scanner_function_arn.value // "not deployed"' platform-outputs.json)
          SNS_ARN=$(jq -r       '.security_alerts_topic_arn.value       // "not deployed"' platform-outputs.json)

          #Sensitive outputs — never print values, only indicate whether they were set
          GRAFANA_PASS_SET=$(jq -r 'if .grafana_admin_password.value and .grafana_admin_password.value != "" then "✓ set" else "not deployed" end' platform-outputs.json)
          OTEL_KEY_SET=$(jq -r     'if .otel_api_key.value and .otel_api_key.value != "" then "✓ set" else "not deployed" end' platform-outputs.json)

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Terraform Apply Complete

          | | |
          |---|---|
          | **Commit** | \`${{ github.sha }}\` |
          | **Actor**  | @${{ github.actor }} |
          | **Run**    | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          **Stacks applied (in order):**
          1. \`stacks/foundation\`
          2. \`stacks/cluster\`
          3. \`stacks/platform\`

          **Key Outputs:**

          | Output | Value |
          |--------|-------|
          | Order API URL | ${ORDER_API_URL} |
          | Grafana URL | ${GRAFANA_URL} |
          | OTel Endpoint | ${OTEL_ENDPOINT} |
          | EKS Cluster | ${EKS_CLUSTER} |
          | VPC ID | ${VPC_ID} |
          | Compliance Scanner | ${SCANNER_ARN} |
          | Security Alerts SNS | ${SNS_ARN} |
          | Grafana Admin Password | ${GRAFANA_PASS_SET} — \`terraform -chdir=stacks/platform output -raw grafana_admin_password\` |
          | OTel API Key | ${OTEL_KEY_SET} — \`terraform -chdir=stacks/platform output -raw otel_api_key\` |
          EOF

  #─────────────────────────────────────────────────────────────────────────────
  #Job 9: Compliance scan — runs after apply on push to main.
  #Invokes the compliance scanner Lambda, waits for results, then queries
  #DynamoDB for CRITICAL findings detected in the last 30 minutes.
  #Fails the pipeline if any new CRITICAL findings were introduced.
  #Skipped gracefully when security module is not deployed (Lambda not found).
  #─────────────────────────────────────────────────────────────────────────────
  compliance-scan:
    runs-on: ubuntu-latest
    needs: apply
    if: vars.AWS_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    environment: ${{ (inputs.environment || 'dev') == 'prod' && 'production' || (inputs.environment || 'dev') }}
    permissions:
      id-token: write
      contents: read
    env:
      TF_VARS: ${{ secrets.TF_VARS }}
      TF_VARS_DEV: ${{ secrets.TF_VARS_DEV }}
      TF_VARS_STAGING: ${{ secrets.TF_VARS_STAGING }}
      TF_VARS_PROD: ${{ secrets.TF_VARS_PROD }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: github-actions-compliance-scan
          aws-region: ${{ env.AWS_REGION }}

      - name: Invoke compliance scanner Lambda
        id: invoke
        run: |
          SELECTED_TF_VARS="${TF_VARS}"
          if [ "${TARGET_ENVIRONMENT}" = "dev" ] && [ -n "${TF_VARS_DEV}" ]; then SELECTED_TF_VARS="${TF_VARS_DEV}"; fi
          if [ "${TARGET_ENVIRONMENT}" = "staging" ] && [ -n "${TF_VARS_STAGING}" ]; then SELECTED_TF_VARS="${TF_VARS_STAGING}"; fi
          if [ "${TARGET_ENVIRONMENT}" = "prod" ] && [ -n "${TF_VARS_PROD}" ]; then SELECTED_TF_VARS="${TF_VARS_PROD}"; fi

          PROJECT_NAME=$(echo "${SELECTED_TF_VARS}" \
            | grep '^project_name' \
            | sed 's/.*= *"\(.*\)".*/\1/' \
            | head -1 \
            || echo "cloudops")
          PROJECT_NAME="${PROJECT_NAME:-cloudops}"
          LAMBDA_NAME="${PROJECT_NAME}-compliance-scanner"
          echo "LAMBDA_NAME=${LAMBDA_NAME}" >> "$GITHUB_ENV"

          echo "Invoking ${LAMBDA_NAME}..."
          aws lambda invoke \
            --function-name "$LAMBDA_NAME" \
            --log-type None \
            /tmp/compliance-scan.json \
            > /tmp/invoke-meta.json 2>&1 || {
            HTTP_CODE=$(python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Error','not found'))" < /tmp/invoke-meta.json 2>/dev/null || echo "not found")
            echo "::warning::Compliance scanner Lambda '${LAMBDA_NAME}' not found or invocation failed (${HTTP_CODE})."
            echo "::warning::The security module may not be deployed. Scan skipped."
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ℹ️ Compliance Scan — Skipped

          | | |
          |---|---|
          | **Lambda** | \`${LAMBDA_NAME}\` |
          | **Reason** | Lambda not found — security module likely not deployed |
          | **Action** | Set \`enable_security = true\` in \`terraform.tfvars\` to activate |
          EOF
            exit 0
          }

          echo "Scan invoked. Waiting 20 seconds for DynamoDB to be populated..."
          sleep 20

      - name: Check for new CRITICAL findings
        run: |
          #Pull the Grafana hostname out of the tfvars secret so the dashboard
          #link in the step summary renders as a real URL. Falls back to a
          #placeholder if domain_name is not set.
          SELECTED_TF_VARS="${TF_VARS}"
          if [ "${TARGET_ENVIRONMENT}" = "dev" ] && [ -n "${TF_VARS_DEV}" ]; then SELECTED_TF_VARS="${TF_VARS_DEV}"; fi
          if [ "${TARGET_ENVIRONMENT}" = "staging" ] && [ -n "${TF_VARS_STAGING}" ]; then SELECTED_TF_VARS="${TF_VARS_STAGING}"; fi
          if [ "${TARGET_ENVIRONMENT}" = "prod" ] && [ -n "${TF_VARS_PROD}" ]; then SELECTED_TF_VARS="${TF_VARS_PROD}"; fi

          DOMAIN=$(echo "${SELECTED_TF_VARS}" \
            | grep '^domain_name' \
            | sed 's/.*= *"\(.*\)".*/\1/' \
            | head -1)
          DOMAIN="${DOMAIN:-example.com}"

          #Findings detected in the last 30 minutes are considered potentially
          #introduced by or coincident with this Terraform apply.
          SCAN_START=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null \
            || python3 -c "from datetime import datetime, timedelta; print((datetime.utcnow()-timedelta(minutes=30)).strftime('%Y-%m-%dT%H:%M:%SZ'))")

          echo "Querying DynamoDB cloudops-security-findings for CRITICAL findings since ${SCAN_START}..."

          RESULT=$(aws dynamodb query \
            --table-name cloudops-security-findings \
            --index-name severity-timestamp-index \
            --key-condition-expression "severity = :sev AND #ts >= :start" \
            --filter-expression "#st = :open" \
            --expression-attribute-names '{"#ts":"timestamp","#st":"status"}' \
            --expression-attribute-values "{\":sev\":{\"S\":\"CRITICAL\"},\":start\":{\"S\":\"${SCAN_START}\"},\":open\":{\"S\":\"OPEN\"}}" \
            --output json 2>/dev/null || echo '{"Items":[],"Count":0}')

          COUNT=$(echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('Count', len(d.get('Items', []))))
          " 2>/dev/null || echo "0")

          #Build findings list for summary (max 10 items)
          FINDINGS_TABLE=$(echo "$RESULT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          items = d.get('Items', [])
          rows = []
          for item in items[:10]:
              check    = item.get('check_name', {}).get('S', item.get('check_type', {}).get('S', 'unknown'))
              resource = item.get('resource_id', {}).get('S', 'unknown')
              ts       = item.get('timestamp', {}).get('S', 'unknown')
              rows.append(f'| CRITICAL | {check} | {resource} | {ts} |')
          print('\n'.join(rows))
          " 2>/dev/null || echo "")

          echo "New CRITICAL findings detected: ${COUNT}"

          if [ "$COUNT" -gt 0 ] 2>/dev/null; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Compliance Scan — New CRITICAL Findings

          | | |
          |---|---|
          | **New CRITICAL findings** | **${COUNT}** |
          | **Detection window** | Last 30 minutes (since apply started) |
          | **DynamoDB table** | \`cloudops-security-findings\` |

          **Findings (up to 10):**

          | Severity | Check | Resource | Detected At |
          |----------|-------|----------|-------------|
          ${FINDINGS_TABLE}

          **Next steps:**
          1. Review the [Security Posture dashboard](https://grafana.${DOMAIN}/d/security-posture)
          2. Follow: \`docs/runbooks/security/compliance-critical-finding.md\`
          3. If this is a false positive, suppress it in DynamoDB with \`status=SUPPRESSED\` and a reason note
          4. Auto-remediation Lambda may already be working — check CloudWatch Logs for \`cloudops-auto-remediation\`
          EOF
            echo "::error::${COUNT} new CRITICAL security finding(s) detected since apply. See step summary for details."
            exit 1
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Compliance Scan — No New CRITICAL Findings

          | | |
          |---|---|
          | **New CRITICAL findings** | 0 |
          | **Scan window** | ${SCAN_START} to now |
          | **Lambda** | \`${{ env.LAMBDA_NAME }}\` |
          | **Status** | Clean — no CRITICAL findings detected since this apply |
          EOF
            echo "Compliance scan passed — no new CRITICAL findings."
          fi

  #─────────────────────────────────────────────────────────────────────────────
  #Job 10: Notify — always runs after apply
  #─────────────────────────────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [apply, compliance-scan]
    if: always()
    steps:
      - name: Write pipeline summary
        run: |
          APPLY_RESULT="${{ needs.apply.result }}"
          SCAN_RESULT="${{ needs.compliance-scan.result }}"

          if [[ "$APPLY_RESULT" == "success" && ("$SCAN_RESULT" == "success" || "$SCAN_RESULT" == "skipped") ]]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ✅ Infra Pipeline Succeeded

          | | |
          |---|---|
          | **Result**           | Apply completed successfully |
          | **Compliance scan**  | ${SCAN_RESULT} |
          | **Commit**           | \`${{ github.sha }}\` |
          | **Modules**          | bootstrap, networking, eks, ingress, observability, security, database |
          | **Run**              | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          EOF
          else
            FAILED_JOB="apply"
            [[ "$SCAN_RESULT" == "failure" ]] && FAILED_JOB="compliance-scan (new CRITICAL findings)"

            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ❌ Infra Pipeline Failed

          | | |
          |---|---|
          | **Result**          | \`${APPLY_RESULT}\` |
          | **Failed job**      | \`${FAILED_JOB}\` |
          | **Compliance scan** | ${SCAN_RESULT} |
          | **Commit**          | \`${{ github.sha }}\` |
          | **Run**             | [${{ github.repository }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          Check the failed job above for details. If apply was not reached,
          the failure may be in \`quality\`, \`security-scan\`, \`manifest-validation\`,
          \`plan\`, or \`approve\`.
          EOF
          fi
