# Mesh pipeline — per-service build/test/lint/scan for the polyglot mesh.
# Each new mesh service is one row in the matrix. Test/lint/build run on PRs
# and (when AUTO_RUN_ON_MERGE=true) on push. With AWS_DEPLOY_ENABLED, pushes
# to main and manual runs then build every service image, push it to its ECR
# repository and print the mesh_*_image lines for the platform stack's
# tfvars (image-build.yml); applying the platform stack deploys them.
#
# Toolchains pinned to match local dev: Node 22, Go 1.22+, Python 3.12,
# Java 17.

name: Mesh Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'apps/api-gateway/**'
      - 'apps/payment/**'
      - 'apps/pricing/**'
      - 'apps/ledger/**'
      - 'apps/inventory/**'
      - 'apps/projection-worker/**'
      - 'apps/fraud/**'
      - 'modules/mesh/**'
      - 'modules/mesh-events/**'
      - '.github/workflows/mesh.yml'
  pull_request:
    paths:
      - 'apps/api-gateway/**'
      - 'apps/payment/**'
      - 'apps/pricing/**'
      - 'apps/ledger/**'
      - 'apps/inventory/**'
      - 'apps/projection-worker/**'
      - 'apps/fraud/**'
      - 'modules/mesh/**'
      - 'modules/mesh-events/**'
      - '.github/workflows/mesh.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment whose ECR repositories receive the images'
        required: true
        type: choice
        default: dev
        options: [dev, staging, prod]

permissions:
  contents: read

concurrency:
  group: mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node services ──────────────────────────────────────────────────────────
  node:
    runs-on: ubuntu-latest
    # Same merge gate as app.yml: push to main only auto-runs when the repo
    # variable is set. PRs + workflow_dispatch always run.
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, payment]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (coverage-gated)
        # Gates live in each service's package.json test:coverage script
        # (api-gateway 90/80/90, payment 85/75/85 lines/branches/functions).
        # Matches the Go (>=70%) and Java (JaCoCo 60%) gates — backlog #147.
        run: npm run test:coverage
      - name: Contract check (env-var drift)
        run: npm run contract-check
      - name: Build
        run: npm run build
      - name: Audit (high+, allowlist in .github/npm-audit-allowlist.json)
        run: npm run audit

  # ── Go services ──────────────────────────────────────────────────────────--
  go:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [pricing, ledger]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The version each service's go.mod asks for. A fixed '1.22' only
          # worked while setup-go let the toolchain download a newer Go;
          # setup-go v6 sets GOTOOLCHAIN=local.
          go-version-file: apps/${{ matrix.service }}/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage gate (>=70%)
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "${{ matrix.service }} coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 >= 70) ? 0 : 1 }' || {
            echo "::error::coverage ${pct}% is below the 70% gate"; exit 1; }
      - name: Build (static linux)
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null .
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
        continue-on-error: true

  # ── Python services ─────────────────────────────────────────────────────---
  python:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, projection-worker]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install (with test extras)
        run: pip install -e ".[test]"
      - name: Test (coverage-gated >=90%)
        # Both services exclude their live-AWS boundary from coverage
        # (inventory: tracing.py; projection-worker: poller.py) via
        # [tool.coverage.run] omit. Testable code sits at 94%/99% — gate at
        # 90% for headroom, matching the Go/Java gates — backlog #147.
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit || true
        continue-on-error: true

  # ── Java services ───────────────────────────────────────────────────────---
  java:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [fraud]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify (test + jacoco coverage gate)
        run: mvn -B verify

  # ── Serverless lambdas (node:test) ──────────────────────────────────────---
  lambdas:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || vars.AUTO_RUN_ON_MERGE == 'true'
    strategy:
      fail-fast: false
      matrix:
        lambda: [enrichment, analytics]
    defaults:
      run:
        working-directory: modules/mesh-events/lambdas/${{ matrix.lambda }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install (deps for the enrichment SDK; analytics has none)
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Test
        run: node --test

  # ── Manifest validation (render + kubeconform) ──────────────────────────────
  manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install render deps (api-gateway provides render-k8s.ts deps)
        run: npm ci --prefix apps/api-gateway
      - name: Validate mesh manifests
        run: ./scripts/validate-k8s-manifests.sh
        env:
          MESH_ONLY: '1'

  # ── Filesystem vuln scan (Trivy) ─────────────────────────────────────────---
  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (mesh apps)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ── Images: build, push, scan; print the tfvars lines ─────────────────────
  images:
    needs: [node, go, python, java]
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api-gateway,       tfvar: mesh_gateway_image }
          - { image: pricing,           tfvar: mesh_pricing_image }
          - { image: inventory,         tfvar: mesh_inventory_image }
          - { image: fraud,             tfvar: mesh_fraud_image }
          - { image: payment,           tfvar: mesh_payment_image }
          - { image: ledger,            tfvar: mesh_ledger_image }
          - { image: projection-worker, tfvar: mesh_projection_image }
    uses: ./.github/workflows/image-build.yml
    with:
      image: ${{ matrix.image }}
      tfvar: ${{ matrix.tfvar }}
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit
